<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>医疗文书模板编辑器</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#eef1f5;color:#222;font-family:Arial,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}.app{height:100%;display:flex;flex-direction:column}
.topbar{height:50px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#24282e;color:#fff;border-bottom:1px solid #111}.brand{font-weight:700;font-size:15px;padding:0 10px 0 3px;white-space:nowrap}.badge{font-size:11px;background:#8b1e1e;padding:4px 8px;border-radius:10px;white-space:nowrap}.tb{height:30px;min-width:32px;border:0;border-radius:4px;background:#31363d;color:#fff;cursor:pointer;padding:0 9px}.tb:hover{background:#3e454e}.tb.on{background:#4a78c9}.sep{width:1px;height:22px;background:#4b5159;margin:0 2px}.spacer{flex:1}
.main{flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr 270px}.panel{background:#fff;min-width:0;overflow:auto}.left{border-right:1px solid #d7dce2}.right{border-left:1px solid #d7dce2;padding:12px}.section{padding:12px 12px 0}.section h3{margin:0 0 8px;font-size:13px}.sub{font-size:11px;color:#8a9099;margin:-3px 0 8px}.item{width:100%;border:1px solid #d7dce2;background:#fafbfc;border-radius:5px;padding:7px 9px;margin-bottom:5px;text-align:left;cursor:pointer;font-size:12px}.item:hover{background:#f2f5f9}.item.active{background:#eef4ff;border-color:#4777c9}.tree{border-left:1px solid #e1e5e9;margin-left:7px;padding-left:8px}.tree .item{font-size:11px}
.stage{overflow:auto;padding:28px 32px;display:flex;justify-content:center;align-items:flex-start;background:#f0f2f5}.paper{position:relative;width:794px;height:1123px;flex:none;background:#fff;box-shadow:0 3px 20px rgba(0,0,0,.18);overflow:hidden}.watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:100;transform:rotate(-31deg);font-size:68px;font-weight:700;letter-spacing:8px;color:rgba(185,30,30,.09)}
.edit-node{position:absolute;z-index:20;white-space:pre-wrap;outline:none;min-width:8px;min-height:18px;cursor:text}.edit-node.selected{outline:1px dashed #4a79c6;background:rgba(74,121,198,.035)}.rule{position:absolute;height:1px;background:#151515;z-index:10}.propgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.propgrid>div.full{grid-column:1/-1}.propgrid label{display:block;font-size:11px;color:#666}.propgrid input,.propgrid select{width:100%;margin-top:3px;padding:6px;border:1px solid #cdd3da;border-radius:4px;background:#fff}.toolbar2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.mini{border:1px solid #cdd3da;background:#fff;border-radius:5px;padding:6px 9px;font-size:11px;cursor:pointer}.note{font-size:11px;line-height:1.6;color:#6d737c;background:#f7f8fa;border:1px solid #e3e6ea;padding:8px;border-radius:5px}.status{font-size:11px;color:#666;line-height:1.7}.pill{display:inline-block;padding:2px 6px;border-radius:10px;background:#edf2f7;margin:0 3px 3px 0}.ok{color:#28764b}.warn{color:#9b6b00}
.report-serif{font-family:"SimSun","宋体","NSimSun","新宋体",serif;font-synthesis:none}.report-serif-bold{font-family:"SimSun","宋体","NSimSun","新宋体",serif;font-weight:700;font-synthesis:none}
@media(max-width:1000px){.main{grid-template-columns:210px 1fr}.right{display:none}}@media print{html,body{overflow:visible;background:#fff}.topbar,.left,.right{display:none}.main{display:block}.stage{padding:0;background:#fff}.paper{box-shadow:none;margin:0}.watermark{display:flex}}
</style>
</head>
<body>
<div class="app"><header class="topbar"><div class="brand">医疗文书模板编辑器</div><span class="badge">仅用于界面/排版演示 · 非真实医疗文书</span><div class="sep"></div><button class="tb" onclick="undo()">↶</button><button class="tb" onclick="redo()">↷</button><div class="sep"></div><button class="tb" onclick="toggleReadonly()">只读</button><button class="tb" onclick="toggleRevision()">修订</button><button class="tb" onclick="insertText()">文字</button><button class="tb" onclick="insertData('time')">时间</button><button class="tb" onclick="insertData('single')">单选</button><button class="tb" onclick="insertData('select')">下拉</button><button class="tb" onclick="insertTable()">表格</button><button class="tb" onclick="toggleWatermark()">水印</button><div class="spacer"></div><button class="tb" onclick="saveLayout()">保存</button><button class="tb" onclick="loadLayout()">载入</button><button class="tb" onclick="window.print()">打印</button></header>
<div class="main"><aside class="panel left"><div class="section"><h3>报告模板</h3><div class="sub">选择模板后可继续编辑</div><button class="item active" id="ctBtn" onclick="useTemplate('ct')">螺旋CT检查报告单</button><button class="item" id="usBtn" onclick="useTemplate('us')">超声检查报告单</button></div><div class="section"><h3>文档结构</h3><div id="tree" class="tree"></div></div><div class="section"><h3>数据元</h3><button class="item" onclick="insertData('text')">文本数据元</button><button class="item" onclick="insertData('time')">日期 / 时间</button><button class="item" onclick="insertData('single')">单选数据元</button><button class="item" onclick="insertData('select')">下拉数据元</button><button class="item" onclick="insertTable()">表格</button></div><div class="section" style="padding-bottom:14px"><div class="note">本版不再用 Noto Serif SC 代替宋体。报告正文优先使用 Windows 传统宋体 SimSun / 宋体；若设备没有该字体才回退到 NSimSun 和浏览器 serif。</div></div></aside>
<main class="stage"><div class="paper" id="paper"><div class="watermark" id="watermark">DEMO · 非真实医疗文书</div></div></main>
<aside class="panel right"><div class="section" style="padding:0"><h3>元素属性</h3><div class="toolbar2"><button class="mini" onclick="align('left')">左对齐</button><button class="mini" onclick="align('center')">居中</button><button class="mini" onclick="bold()">加粗</button><button class="mini" onclick="duplicate()">复制</button><button class="mini" onclick="removeNode()">删除</button></div><div class="propgrid"><div class="full"><label>内容</label><input id="txt"></div><div><label>字体</label><select id="font"><option value="SimSun">宋体 / SimSun</option><option value="NSimSun">新宋体 / NSimSun</option><option value="SimHei">黑体 / SimHei</option><option value="FangSong">仿宋 / FangSong</option><option value="KaiTi">楷体 / KaiTi</option><option value="Microsoft YaHei">微软雅黑</option><option value="serif">浏览器衬线字体</option></select></div><div><label>字号</label><input id="size" type="number" min="8" max="72"></div><div><label>字重</label><select id="weight"><option value="400">常规</option><option value="700">粗体</option></select></div><div><label>行高</label><input id="line" type="number" step="0.1" min="1" max="3"></div><div><label>字间距(px)</label><input id="letter" type="number" step="0.1" min="-2" max="10"></div><div><label>左(px)</label><input id="left" type="number"></div><div><label>上(px)</label><input id="top" type="number"></div><div><label>宽(px)</label><input id="width" type="number"></div><div><label>高(px)</label><input id="height" type="number"></div></div></div><div class="section" style="padding:14px 0 0"><h3>编辑状态</h3><div id="status" class="status">未选择元素</div></div><div class="section" style="padding:14px 0 0"><h3>字体状态</h3><div id="fontStatus" class="status">正在检测系统字体……</div></div></aside></div></div>
<script>
const paper=document.getElementById('paper'),tree=document.getElementById('tree'),wm=document.getElementById('watermark');let selected=null,history=[],future=[],readonly=false,revision=false,waterOn=true;const reportFont='SimSun,"宋体","NSimSun","新宋体",serif';
function snap(){return [...paper.querySelectorAll('.edit-node')].map(e=>({id:e.dataset.id,text:e.innerText,style:e.getAttribute('style')}))}function pushHistory(){history.push(JSON.stringify(snap()));if(history.length>60)history.shift();future=[]}function restore(data){paper.querySelectorAll('.edit-node,.rule').forEach(e=>e.remove());data.forEach(x=>{const e=document.createElement('div');e.className='edit-node';e.dataset.id=x.id;e.innerText=x.text;e.setAttribute('style',x.style||'');e.contentEditable=!readonly;e.draggable=!readonly;bind(e);paper.appendChild(e)});selected=null;refreshTree()}function undo(){if(!history.length)return;future.push(JSON.stringify(snap()));restore(JSON.parse(history.pop()))}function redo(){if(!future.length)return;history.push(JSON.stringify(snap()));restore(JSON.parse(future.pop()))}function add(id,text,style){const e=document.createElement('div');e.className='edit-node';e.dataset.id=id;e.innerText=text;e.setAttribute('style',style);e.contentEditable=!readonly;e.draggable=!readonly;bind(e);paper.appendChild(e);return e}function rule(left,top,width){const e=document.createElement('div');e.className='rule';e.style=`left:${left}px;top:${top}px;width:${width}px`;paper.appendChild(e)}function bind(e){e.addEventListener('click',ev=>{ev.stopPropagation();select(e)});e.addEventListener('focus',()=>select(e));e.addEventListener('input',()=>{if(selected===e)document.getElementById('txt').value=e.innerText;refreshTree()});e.addEventListener('dragend',ev=>{if(readonly)return;const r=paper.getBoundingClientRect();e.style.left=Math.max(0,Math.round(ev.clientX-r.left-8))+'px';e.style.top=Math.max(0,Math.round(ev.clientY-r.top-8))+'px';select(e);pushHistory()})}paper.addEventListener('click',()=>select(null));function select(e){if(selected)selected.classList.remove('selected');selected=e;if(!e){document.getElementById('status').textContent='未选择元素';refreshTree();return}e.classList.add('selected');const s=getComputedStyle(e);document.getElementById('txt').value=e.innerText;const fam=(s.fontFamily||'SimSun').split(',')[0].replaceAll('"','').trim();document.getElementById('font').value=[...document.getElementById('font').options].some(o=>o.value===fam)?fam:'SimSun';document.getElementById('size').value=parseInt(s.fontSize)||13;document.getElementById('weight').value=s.fontWeight;document.getElementById('line').value=s.lineHeight==='normal'?1.5:(parseFloat(s.lineHeight)/parseFloat(s.fontSize)).toFixed(1);document.getElementById('letter').value=parseFloat(s.letterSpacing)||0;document.getElementById('left').value=parseInt(e.style.left)||e.offsetLeft;document.getElementById('top').value=parseInt(e.style.top)||e.offsetTop;document.getElementById('width').value=parseInt(e.style.width)||e.offsetWidth;document.getElementById('height').value=parseInt(e.style.height)||e.offsetHeight;document.getElementById('status').innerHTML='<span class="pill">'+e.dataset.id+'</span> 可编辑元素';refreshTree()}function refreshTree(){tree.innerHTML='';[...paper.querySelectorAll('.edit-node')].forEach((e,i)=>{const b=document.createElement('button');b.className='item'+(e===selected?' active':'');b.textContent=(i+1)+'. '+e.dataset.id;b.onclick=()=>select(e);tree.appendChild(b)})}
function setProp(id,fn){document.getElementById(id).addEventListener('change',()=>{if(!selected)return;pushHistory();fn(selected,document.getElementById(id).value);refreshTree()})}setProp('txt',(e,v)=>e.innerText=v);setProp('font',(e,v)=>e.style.fontFamily=v==='serif'?'serif':v);setProp('size',(e,v)=>e.style.fontSize=v+'px');setProp('weight',(e,v)=>e.style.fontWeight=v);setProp('line',(e,v)=>e.style.lineHeight=v);setProp('letter',(e,v)=>e.style.letterSpacing=v+'px');setProp('left',(e,v)=>e.style.left=v+'px');setProp('top',(e,v)=>e.style.top=v+'px');setProp('width',(e,v)=>e.style.width=v+'px');setProp('height',(e,v)=>e.style.height=v+'px');function align(a){if(!selected)return;pushHistory();selected.style.textAlign=a}function bold(){if(!selected)return;pushHistory();selected.style.fontWeight=getComputedStyle(selected).fontWeight==='700'?'400':'700'}function duplicate(){if(!selected)return;pushHistory();const e=selected.cloneNode(true);e.dataset.id=selected.dataset.id+'_copy';e.style.left=(selected.offsetLeft+18)+'px';e.style.top=(selected.offsetTop+18)+'px';bind(e);paper.appendChild(e);select(e)}function removeNode(){if(!selected)return;pushHistory();selected.remove();selected=null;refreshTree()}function insertText(){pushHistory();select(add('text_'+Date.now(),'新文字',`left:140px;top:300px;width:180px;font-family:${reportFont};font-size:14px;line-height:1.6`))}function insertData(type){pushHistory();const t=type==='time'?'2026-09-14 18:00':type==='single'?'【单选：男】':type==='select'?'【下拉：请选择】':'【文本数据元】';select(add('data_'+Date.now(),t,`left:140px;top:340px;width:220px;font-family:${reportFont};font-size:14px`))}function insertTable(){pushHistory();select(add('table_'+Date.now(),'表格数据元\n┌────────┬────────┐\n│ 字段 1 │ 字段 2 │\n├────────┼────────┤\n│ 示例   │ 示例   │\n└────────┴────────┘',`left:140px;top:380px;width:360px;font-family:${reportFont};font-size:13px;line-height:1.5`))}function toggleReadonly(){readonly=!readonly;paper.classList.toggle('readonly',readonly);paper.querySelectorAll('.edit-node').forEach(e=>{e.contentEditable=!readonly;e.draggable=!readonly});document.querySelectorAll('.tb').forEach(b=>{if(b.textContent==='只读')b.classList.toggle('on',readonly)})}function toggleRevision(){revision=!revision;document.querySelectorAll('.tb').forEach(b=>{if(b.textContent==='修订')b.classList.toggle('on',revision)})}function toggleWatermark(){waterOn=!waterOn;wm.style.display=waterOn?'flex':'none'}function saveLayout(){localStorage.setItem('medical_editor_layout_v4',JSON.stringify({nodes:snap(),watermark:waterOn}));alert('布局已保存到当前浏览器。')}function loadLayout(){const raw=localStorage.getItem('medical_editor_layout_v4');if(!raw){alert('尚未保存布局。');return}try{const d=JSON.parse(raw);restore(d.nodes||[]);waterOn=d.watermark!==false;wm.style.display=waterOn?'flex':'none'}catch(e){alert('布局读取失败。')}}
function useTemplate(type){pushHistory();paper.querySelectorAll('.edit-node,.rule').forEach(e=>e.remove());document.getElementById('ctBtn').classList.toggle('active',type==='ct');document.getElementById('usBtn').classList.toggle('active',type==='us');if(type==='ct'){add('hospital','郑州某某医院（示例）',`left:190px;top:26px;width:414px;text-align:center;font-family:${reportFont};font-size:23px;font-weight:700;line-height:1.25`);add('title','螺旋CT检查报告单（示例）',`left:220px;top:67px;width:354px;text-align:center;font-family:${reportFont};font-size:16px;font-weight:700;line-height:1.25`);rule(55,99,684);add('basic1','姓名：匿名患者　　性别：男　　年龄：27岁',`left:55px;top:116px;width:385px;font-family:${reportFont};font-size:13px;line-height:1.5`);add('basic2','影像号：DEMO-000001',`left:470px;top:116px;width:245px;font-family:${reportFont};font-size:13px;line-height:1.5`);add('basic3','科室：门诊外科　　就诊日期：2026-01-01',`left:55px;top:145px;width:665px;font-family:${reportFont};font-size:13px;line-height:1.5`);add('basic4','门诊号：DEMO-000002　　报告日期：2026-01-01',`left:55px;top:174px;width:665px;font-family:${reportFont};font-size:13px;line-height:1.5`);rule(55,204,684);add('item','检查名称：16排CT平扫\n检查部位：腰椎椎间盘',`left:55px;top:221px;width:665px;font-family:${reportFont};font-size:13px;line-height:1.65`);rule(55,281,684);add('findTitle','影像表现：',`left:55px;top:301px;width:100px;font-family:${reportFont};font-size:13px;font-weight:700;line-height:1.4`);add('findings','腰椎生理曲度存在，排列可，L4-5、L5-S1椎间盘变扁，L4-5椎间盘偏左、L5-S1椎间盘偏左；椎管前后径改变。',`left:55px;top:332px;width:680px;font-family:${reportFont};font-size:13px;line-height:1.75`);add('impressionTitle','印象：',`left:55px;top:758px;width:80px;font-family:${reportFont};font-size:13px;font-weight:700`);add('impression','1. L4-5椎间盘突出、偏左\n2. L5-S1椎间盘突出、偏左\n请结合临床及其他相关检查',`left:55px;top:790px;width:500px;font-family:${reportFont};font-size:13px;line-height:1.8`);rule(55,1006,684);add('footer','报告医师：示例　　　　　　　　审核医师：示例',`left:250px;top:1019px;width:480px;font-family:${reportFont};font-size:13px;line-height:1.5`);add('note','（此页面仅用于界面/排版演示，不作医疗凭证）',`left:150px;top:1057px;width:520px;text-align:center;font-family:${reportFont};font-size:10px;color:#777`)}else{add('hospital','某某大学附属医院（示例）',`left:190px;top:30px;width:414px;text-align:center;font-family:${reportFont};font-size:23px;font-weight:700`);add('title','超声检查报告单（示例）',`left:220px;top:69px;width:354px;text-align:center;font-family:${reportFont};font-size:16px;font-weight:700`);rule(55,100,684);add('basic','姓名：匿名患者　　性别：男　　年龄：17岁　　检查号：DEMO-000001',`left:55px;top:116px;width:680px;font-family:${reportFont};font-size:13px`);add('clinical','临床诊断：示例',`left:55px;top:146px;width:680px;font-family:${reportFont};font-size:13px`);add('item','检查项目：双肾及输尿管膀胱超声（示例）',`left:55px;top:176px;width:680px;font-family:${reportFont};font-size:13px`);rule(55,210,684);add('findTitle','超声所见：',`left:55px;top:230px;width:100px;font-family:${reportFont};font-size:13px;font-weight:700`);add('find','这里放置超声所见示例文字，用于演示排版、字体和位置调整。',`left:55px;top:266px;width:680px;font-family:${reportFont};font-size:13px;line-height:1.8`);add('hintTitle','超声提示：',`left:55px;top:470px;width:100px;font-family:${reportFont};font-size:13px;font-weight:700`);add('hint','① 示例项目一\n② 示例项目二\n③ 示例项目三',`left:55px;top:505px;width:680px;font-family:${reportFont};font-size:13px;line-height:1.8`)}refreshTree()}
function detectFonts(){const status=document.getElementById('fontStatus');const c=document.createElement('canvas'),ctx=c.getContext('2d');ctx.font='16px SimSun';const a=ctx.measureText('汉字测试').width;ctx.font='16px serif';const b=ctx.measureText('汉字测试').width;status.innerHTML=a!==b?'<span class="ok">✓ 检测到系统宋体 / SimSun，报告模板将优先使用。</span>':'<span class="warn">⚠ 未能确认 SimSun，浏览器将使用回退字体。</span>'}
useTemplate('ct');detectFonts();
</script></body></html>
