<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>医疗文书模板编辑器 Demo</title>
<style>
:root{--top:52px;--left:250px;--right:300px;--border:#d8dde4;--bg:#eef1f5;--panel:#fff;--blue:#3775d6;--text:#1f2328}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}.topbar{height:var(--top);display:flex;align-items:center;gap:6px;padding:0 10px;background:#252a31;color:#fff;border-bottom:1px solid #111;flex:none}.brand{font-size:15px;font-weight:700;white-space:nowrap}.badge{font-size:11px;background:#9d2828;padding:4px 8px;border-radius:10px;white-space:nowrap}.sep{width:1px;height:24px;background:#4c535c;margin:0 3px}.spacer{flex:1}.tb{height:31px;min-width:34px;padding:0 9px;border:0;border-radius:5px;background:#30363d;color:#fff}.tb:hover{background:#3c444d}.tb.on{background:#356bc3}.tb:disabled{opacity:.45;cursor:not-allowed}
.layout{display:grid;grid-template-columns:var(--left) 1fr var(--right);height:calc(100vh - var(--top));min-height:0}.panel{background:var(--panel);min-width:0;overflow:auto}.left{border-right:1px solid var(--border)}.right{border-left:1px solid var(--border);padding:12px}.section{padding:12px}.section h3{margin:0 0 8px;font-size:13px}.sub{font-size:11px;color:#7a828d;margin:-2px 0 8px}.item{width:100%;border:1px solid var(--border);background:#fafbfc;border-radius:6px;padding:8px 9px;margin-bottom:6px;text-align:left;font-size:12px}.item:hover{background:#f3f6fa}.item.active{background:#eef4ff;border-color:#4a7bd1;box-shadow:inset 0 0 0 1px #4a7bd1}.tree{border-left:1px solid #e0e4e8;margin-left:6px;padding-left:8px}.tree .item{font-size:11px}.stage{position:relative;overflow:auto;background:#eef1f5;padding:24px;display:flex;justify-content:center;align-items:flex-start}.stage-inner{position:relative}.paper{position:relative;width:864px;height:1254px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.16);overflow:hidden;transform-origin:top left}.watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:100;transform:rotate(-31deg);font-weight:800;font-size:60px;letter-spacing:7px;color:rgba(185,30,30,.09);white-space:nowrap}.node{position:absolute;z-index:20;min-width:8px;min-height:16px;white-space:pre-wrap;outline:none;user-select:text;cursor:text}.node.selected{outline:1px dashed #4a79d6;background:rgba(74,121,214,.045)}.node.dragging{cursor:grabbing;opacity:.92}.rule{position:absolute;z-index:10;height:1px;background:#171717}.node[data-locked="true"]{background-image:linear-gradient(135deg,rgba(0,0,0,.04) 25%,transparent 25%,transparent 50%,rgba(0,0,0,.04) 50%,rgba(0,0,0,.04) 75%,transparent 75%);background-size:8px 8px}.selection-box{position:absolute;z-index:90;border:1px solid var(--blue);pointer-events:none;display:none}.guide{position:absolute;z-index:80;background:#4a79d6;display:none;pointer-events:none}.guide.v{width:1px;height:100%}.guide.h{width:100%;height:1px}.right-title{display:flex;justify-content:space-between;align-items:center}.pill{display:inline-block;padding:2px 6px;background:#eef2f7;border-radius:999px;font-size:10px;color:#55606d}.toolbar2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.mini{padding:6px 8px;border:1px solid #cfd5dc;background:#fff;border-radius:5px;font-size:11px}.mini:hover{background:#f4f6f8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .full{grid-column:1/-1}.grid label{display:block;font-size:11px;color:#67707b}.grid input,.grid select,.search{width:100%;margin-top:4px;padding:7px;border:1px solid #cfd5dc;border-radius:5px;background:#fff}.search{margin:0 0 8px}.note{font-size:11px;line-height:1.65;color:#65707c;background:#f7f8fa;border:1px solid #e3e6ea;padding:9px;border-radius:6px}.status{font-size:11px;line-height:1.6;color:#69737d}.status.good{color:#23734a}.status.bad{color:#9b3c23}.status.warn{color:#9b7000}.diagnostic{padding:8px;border:1px solid #e4e7eb;border-radius:6px;background:#fafbfc;font-size:11px;line-height:1.7}.issue{padding:3px 0}.footerbar{display:flex;gap:6px;flex-wrap:wrap}.footerbar button{flex:1;min-width:100px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;z-index:300}.modal.show{display:flex}.modal-card{width:min(760px,92vw);max-height:82vh;overflow:auto;background:#fff;border-radius:10px;box-shadow:0 16px 50px rgba(0,0,0,.22);padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modal-head b{font-size:15px}.modal-card textarea{width:100%;height:360px;resize:vertical;padding:10px;border:1px solid #ccd3db;border-radius:6px;font-family:Consolas,monospace;font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.primary{background:#3f73c9;color:#fff;border:0;border-radius:6px;padding:8px 12px}.secondary{background:#fff;border:1px solid #ccd3db;border-radius:6px;padding:8px 12px}.toast{position:fixed;right:18px;bottom:18px;z-index:500;background:#20252b;color:#fff;padding:9px 12px;border-radius:7px;box-shadow:0 6px 24px rgba(0,0,0,.22);font-size:12px;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1150px){:root{--left:220px;--right:280px}}@media(max-width:980px){.layout{grid-template-columns:210px 1fr}.right{display:none}}
@media print{html,body{overflow:visible;background:#fff}@page{size:216mm 313.5mm;margin:0}.topbar,.left,.right{display:none!important}.layout{display:block;height:auto}.stage{padding:0;background:#fff;overflow:visible}.stage-inner{margin:0}.paper{width:864px;height:1254px;box-shadow:none;transform:none}.watermark{display:flex}.node.selected{outline:none;background:none}.selection-box,.guide{display:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div class="brand">医疗文书模板编辑器</div><span class="badge">仅用于界面/排版演示 · 非真实医疗文书</span><div class="sep"></div>
<button class="tb" id="undoBtn" title="Ctrl+Z">↶</button><button class="tb" id="redoBtn" title="Ctrl+Y">↷</button><div class="sep"></div>
<button class="tb" id="readonlyBtn">只读</button><button class="tb" id="revisionBtn">修订</button><button class="tb" id="addTextBtn">文字</button><button class="tb" id="timeBtn">时间</button><button class="tb" id="singleBtn">单选</button><button class="tb" id="selectBtn">下拉</button><button class="tb" id="tableBtn">表格</button><button class="tb" id="waterBtn">水印</button><button class="tb" id="checkBtn">智能检查</button><button class="tb" id="fitBtn">适应页面</button>
<div class="spacer"></div><button class="tb" id="saveBtn">保存</button><button class="tb" id="loadBtn">载入</button><button class="tb" id="exportBtn">导出</button><button class="tb" id="printBtn">打印</button>
</header>
<div class="layout">
<aside class="panel left">
<div class="section"><h3>报告模板</h3><div class="sub">选择后载入匿名演示模板</div><button class="item active" id="ctBtn">螺旋CT检查报告单</button><button class="item" id="usBtn">超声检查报告单</button></div>
<div class="section"><h3>文档结构</h3><input class="search" id="search" placeholder="搜索元素，如：影像、姓名…"><div id="tree" class="tree"></div></div>
<div class="section"><h3>数据元</h3><button class="item" data-insert="text">文本数据元</button><button class="item" data-insert="time">日期 / 时间</button><button class="item" data-insert="single">单选数据元</button><button class="item" data-insert="select">下拉数据元</button><button class="item" data-insert="table">表格</button></div>
<div class="section"><div class="note">快捷键：Ctrl+Z 撤销、Ctrl+Y 重做、Delete 删除选中元素、方向键微调位置。双击画布空白处可新增文字。</div></div>
</aside>
<main class="stage" id="stage"><div class="stage-inner" id="stageInner"><div class="paper" id="paper"><div class="watermark" id="watermark">DEMO · 非真实医疗文书</div><div class="selection-box" id="selectionBox"></div><div class="guide v" id="guideV"></div><div class="guide h" id="guideH"></div></div></div></main>
<aside class="panel right">
<div class="section" style="padding-top:0"><div class="right-title"><h3 style="margin:0">元素属性</h3><span class="pill" id="selectedPill">未选择</span></div>
<div class="toolbar2" style="margin-top:9px"><button class="mini" id="alignLeft">左对齐</button><button class="mini" id="alignCenter">居中</button><button class="mini" id="alignRight">右对齐</button><button class="mini" id="boldBtn">加粗</button><button class="mini" id="lockBtn">锁定</button><button class="mini" id="duplicateBtn">复制</button><button class="mini" id="deleteBtn">删除</button></div>
<div class="grid"><div class="full"><label>内容</label><input id="txt"></div><div><label>字体</label><select id="font"><option value="SimSun">宋体 / SimSun</option><option value="NSimSun">新宋体 / NSimSun</option><option value="SimHei">黑体 / SimHei</option><option value="FangSong">仿宋 / FangSong</option><option value="KaiTi">楷体 / KaiTi</option><option value="Microsoft YaHei">微软雅黑</option><option value="serif">浏览器衬线字体</option></select></div><div><label>字号(px)</label><input id="size" type="number" min="8" max="72" step="1"></div><div><label>字重</label><select id="weight"><option value="400">常规</option><option value="700">粗体</option></select></div><div><label>行高</label><input id="line" type="number" min="1" max="3" step="0.1"></div><div><label>字间距(px)</label><input id="letter" type="number" min="-2" max="10" step="0.1"></div><div><label>左(px)</label><input id="left" type="number"></div><div><label>上(px)</label><input id="top" type="number"></div><div><label>宽(px)</label><input id="width" type="number"></div><div><label>高(px)</label><input id="height" type="number"></div></div></div>
<div class="section"><h3>智能检查</h3><div class="diagnostic" id="diagnostic">点击“智能检查”分析当前页面。</div></div>
<div class="section"><h3>编辑状态</h3><div class="status" id="status">未选择元素</div></div>
<div class="section"><h3>字体状态</h3><div class="status" id="fontStatus">检测中…</div></div>
<div class="section"><div class="note">报告正文优先使用 Windows 传统宋体 SimSun。系统字体和网页字体属于两套不同机制；模板默认不强制替换系统字体，以便在 Windows 上尽量还原传统打印效果。</div></div>
<div class="section footerbar"><button class="secondary" id="jsonBtn">JSON</button><button class="secondary" id="resetBtn">重置当前模板</button></div>
</aside></div></div>
<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><b id="modalTitle">导出数据</b><button class="secondary" id="modalClose">关闭</button></div><textarea id="modalText"></textarea><div class="modal-actions"><button class="secondary" id="modalCopy">复制到剪贴板</button><button class="primary" id="modalAction">完成</button></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const paper=document.getElementById('paper'),tree=document.getElementById('tree'),stage=document.getElementById('stage'),stageInner=document.getElementById('stageInner');const watermark=document.getElementById('watermark'),selectionBox=document.getElementById('selectionBox'),guideV=document.getElementById('guideV'),guideH=document.getElementById('guideH');const $=id=>document.getElementById(id);let selected=null,history=[],future=[],readonly=false,revision=false,waterOn=true,zoom=1,dragState=null,searchText='';const reportFont='SimSun,"宋体","NSimSun","新宋体",serif';
const templates={ct:[{id:'hospital',text:'郑州某某医院（示例）',style:`left:185px;top:34px;width:495px;text-align:center;font-family:${reportFont};font-size:25px;font-weight:700;line-height:1`},{id:'title',text:'螺旋CT检查报告单（示例）',style:`left:190px;top:77px;width:485px;text-align:center;font-family:${reportFont};font-size:17px;font-weight:700;line-height:1`},{id:'basic1',text:'姓名：匿名患者',style:`left:37px;top:129px;width:165px;font-family:${reportFont};font-size:13px;line-height:1`},{id:'basic2',text:'性别：男',style:`left:271px;top:129px;width:100px;font-family:${reportFont};font-size:13px;line-height:1`},{id:'basic3',text:'年龄：27岁',style:`left:430px;top:129px;width:120px;font-family:${reportFont};font-size:13px;line-height:1`},{id:'basic4',text:'影像号：DEMO-000001',style:`left:622px;top:129px;width:220px;font-family:${reportFont};font-size:13px;line-height:1`},{id:'basic5',text:'科室：门诊外科',style:`left:37px;top:163px;width:165px;font-family:${reportFont};font-size:13px;line-height:1`},{id:'basic6',text:'住院号：DEMO-000002',style:`left:271px;top:163px;width:170px;font-family:${reportFont};font-size:13px;line-height:1`},{id:'basic7',text:'床位：—',style:`left:430px;top:163px;width:120px;font-family:${reportFont};font-size:13px;line-height:1`},{id:'basic8',text:'检查日期：2026年01月01日',style:`left:622px;top:163px;width:230px;font-family:${reportFont};font-size:13px;line-height:1`},{id:'basic9',text:'门诊号：DEMO-000003',style:`left:37px;top:197px;width:185px;font-family:${reportFont};font-size:13px;line-height:1`},{id:'basic10',text:'报告日期：2026年01月01日',style:`left:622px;top:197px;width:230px;font-family:${reportFont};font-size:13px;line-height:1`},{id:'exam',text:'检查名称：16排CT平扫\n检查部位：腰椎椎间盘',style:`left:37px;top:239px;width:500px;font-family:${reportFont};font-size:13px;line-height:1.65`},{id:'findTitle',text:'影像表现：',style:`left:37px;top:327px;width:110px;font-family:${reportFont};font-size:14px;font-weight:700;line-height:1`},{id:'findings',text:'腰椎生理曲度存在，排列可，L4-5、L5-S1椎间盘变扁，L4-5椎间盘偏左，\nL5-S1椎间盘偏左，椎管前后径改变，黄韧带无肥厚，椎体未见明显骨质增生。',style:`left:37px;top:357px;width:790px;font-family:${reportFont};font-size:13px;line-height:1.7`},{id:'impressionTitle',text:'印象：',style:`left:37px;top:845px;width:75px;font-family:${reportFont};font-size:14px;font-weight:700;line-height:1`},{id:'impression',text:'1. L4-5椎间盘突出、偏左，椎管狭窄\n2. L5-S1椎间盘突出、偏左，椎管狭窄\n请结合临床及其他相关检查',style:`left:37px;top:875px;width:620px;font-family:${reportFont};font-size:13px;line-height:1.75`},{id:'footer',text:'报告医师：示例　　　　　　　　　审核医师：示例',style:`left:300px;top:1132px;width:545px;font-family:${reportFont};font-size:13px;line-height:1`},{id:'note',text:'（本页面仅用于界面/排版演示，不作医疗凭证）',style:`left:225px;top:1172px;width:500px;text-align:center;font-family:${reportFont};font-size:10px;color:#777;line-height:1`}],us:[{id:'hospital',text:'某某大学附属医院（示例）',style:`left:180px;top:35px;width:500px;text-align:center;font-family:${reportFont};font-size:25px;font-weight:700`},{id:'title',text:'超声检查报告单（示例）',style:`left:205px;top:77px;width:455px;text-align:center;font-family:${reportFont};font-size:17px;font-weight:700`},{id:'basic',text:'姓名：匿名患者　　性别：男　　年龄：17岁　　检查号：DEMO-000001',style:`left:37px;top:130px;width:790px;font-family:${reportFont};font-size:13px`},{id:'clinical',text:'临床诊断：示例',style:`left:37px;top:164px;width:790px;font-family:${reportFont};font-size:13px`},{id:'item',text:'检查项目：双肾及输尿管膀胱超声（示例）',style:`left:37px;top:198px;width:790px;font-family:${reportFont};font-size:13px`},{id:'findTitle',text:'超声所见：',style:`left:37px;top:252px;width:110px;font-family:${reportFont};font-size:14px;font-weight:700`},{id:'find',text:'这里放置超声所见示例文字，用于演示模板编辑、字体控制及位置调整。',style:`left:37px;top:285px;width:790px;font-family:${reportFont};font-size:13px;line-height:1.8`},{id:'hintTitle',text:'超声提示：',style:`left:37px;top:520px;width:110px;font-family:${reportFont};font-size:14px;font-weight:700`},{id:'hint',text:'① 示例项目一\n② 示例项目二\n③ 示例项目三',style:`left:37px;top:553px;width:790px;font-family:${reportFont};font-size:13px;line-height:1.8`} ]};
function mkRule(id,left,top,width){const e=document.createElement('div');e.className='rule';e.dataset.id=id;e.style=`left:${left}px;top:${top}px;width:${width}px`;paper.appendChild(e)}
function mkNode(d){const e=document.createElement('div');e.className='node';e.dataset.id=d.id;e.innerText=d.text;e.setAttribute('style',d.style||'');e.dataset.locked=d.locked?'true':'false';e.contentEditable=!readonly;e.draggable=false;bindNode(e);paper.appendChild(e);return e}
function bindNode(e){e.addEventListener('pointerdown',onPointerDown);e.addEventListener('click',ev=>{ev.stopPropagation();select(e)});e.addEventListener('dblclick',ev=>{ev.stopPropagation();if(!readonly&&!locked(e)){e.focus()}});e.addEventListener('input',()=>{if(selected===e)syncPanelFromSelection();refreshTree()})}
function locked(e){return e.dataset.locked==='true'} function clearDoc(){paper.querySelectorAll('.node,.rule').forEach(e=>e.remove());selected=null;refreshTree()}
function useTemplate(type,record=true){if(record)pushHistory();clearDoc();if(type==='ct'){mkRule('rule1',36,112,806);templates.ct.forEach(mkNode);mkRule('rule2',36,221,806);mkRule('rule3',36,305,806)}else{templates.us.forEach(mkNode);mkRule('rule1',36,110,806);mkRule('rule2',36,229,806)}document.body.dataset.template=type;$('ctBtn').classList.toggle('active',type==='ct');$('usBtn').classList.toggle('active',type==='us');refreshTree();fitPage();smartCheck()}
function snapshot(){return [...paper.querySelectorAll('.node,.rule')].map(e=>({kind:e.classList.contains('rule')?'rule':'node',id:e.dataset.id||null,text:e.innerText||'',style:e.getAttribute('style')||'',locked:e.dataset.locked==='true'}))}
function restore(data){clearDoc();data.forEach(x=>{if(x.kind==='rule'){const e=document.createElement('div');e.className='rule';e.dataset.id=x.id;e.setAttribute('style',x.style||'');paper.appendChild(e)}else mkNode(x)});selected=null;refreshTree();smartCheck()}
function pushHistory(){history.push(JSON.stringify(snapshot()));if(history.length>80)history.shift();future=[];updateHistoryButtons()}
function doUndo(){if(!history.length)return;future.push(JSON.stringify(snapshot()));restore(JSON.parse(history.pop()));updateHistoryButtons();toast('已撤销')}
function doRedo(){if(!future.length)return;history.push(JSON.stringify(snapshot()));restore(JSON.parse(future.pop()));updateHistoryButtons();toast('已重做')}
function updateHistoryButtons(){$('undoBtn').disabled=!history.length;$('redoBtn').disabled=!future.length}
function select(e){if(selected)selected.classList.remove('selected');selected=e;if(e){e.classList.add('selected');$('selectedPill').textContent=e.dataset.id;syncPanelFromSelection();showSelectionBox()}else{$('selectedPill').textContent='未选择';$('status').textContent='未选择元素';selectionBox.style.display='none'}refreshTree()}
function syncPanelFromSelection(){if(!selected)return;const s=getComputedStyle(selected);$('txt').value=selected.innerText;$('font').value=[...$('font').options].some(o=>o.value===s.fontFamily.split(',')[0].replaceAll('"','').trim())?s.fontFamily.split(',')[0].replaceAll('"','').trim():'SimSun';$('size').value=parseInt(s.fontSize)||13;$('weight').value=s.fontWeight;$('line').value=s.lineHeight==='normal'?1.5:(parseFloat(s.lineHeight)/parseFloat(s.fontSize)).toFixed(1);$('letter').value=parseFloat(s.letterSpacing)||0;$('left').value=parseInt(selected.style.left)||selected.offsetLeft;$('top').value=parseInt(selected.style.top)||selected.offsetTop;$('width').value=parseInt(selected.style.width)||selected.offsetWidth;$('height').value=parseInt(selected.style.height)||selected.offsetHeight;$('status').innerHTML=`<span class="pill">${selected.dataset.id}</span> 可编辑${locked(selected)?' · 已锁定':''}`}
function prop(id,fn){$(id).addEventListener('change',()=>{if(!selected||readonly||locked(selected))return;pushHistory();fn(selected,$(id).value);syncPanelFromSelection();showSelectionBox()})}prop('txt',(e,v)=>e.innerText=v);prop('font',(e,v)=>e.style.fontFamily=v==='serif'?'serif':v);prop('size',(e,v)=>e.style.fontSize=v+'px');prop('weight',(e,v)=>e.style.fontWeight=v);prop('line',(e,v)=>e.style.lineHeight=v);prop('letter',(e,v)=>e.style.letterSpacing=v+'px');prop('left',(e,v)=>e.style.left=v+'px');prop('top',(e,v)=>e.style.top=v+'px');prop('width',(e,v)=>e.style.width=v+'px');prop('height',(e,v)=>e.style.height=v+'px');

function addTextAt(x=120,y=300,text='新文字'){if(readonly)return;pushHistory();const e=mkNode({id:'text_'+Date.now(),text,style:`left:${Math.round(x)}px;top:${Math.round(y)}px;width:220px;font-family:${reportFont};font-size:13px;line-height:1.6`});select(e);e.focus()}

function refreshTree(){const q=searchText.trim().toLowerCase();tree.innerHTML='';[...paper.querySelectorAll('.node')].filter(e=>!q||e.dataset.id.toLowerCase().includes(q)||e.innerText.toLowerCase().includes(q)).forEach((e,i)=>{const b=document.createElement('button');b.className='item'+(e===selected?' active':'');b.textContent=`${i+1}. ${e.dataset.id}`;b.onclick=()=>select(e);tree.appendChild(b)})}$('search').addEventListener('input',e=>{searchText=e.target.value;refreshTree()});
function showSelectionBox(){if(!selected)return;selectionBox.style.display='block';selectionBox.style.left=selected.offsetLeft+'px';selectionBox.style.top=selected.offsetTop+'px';selectionBox.style.width=selected.offsetWidth+'px';selectionBox.style.height=selected.offsetHeight+'px'}function showGuides(e){const cx=e.offsetLeft+e.offsetWidth/2,cy=e.offsetTop+e.offsetHeight/2;guideV.style.display=Math.abs(cx-432)<5?'block':'none';guideV.style.left=cx+'px';guideH.style.display=Math.abs(cy-627)<5?'block':'none';guideH.style.top=cy+'px'}function hideGuides(){guideV.style.display='none';guideH.style.display='none'}

function smartCheck(){const issues=[];paper.querySelectorAll('.node').forEach(e=>{const l=e.offsetLeft,t=e.offsetTop,r=l+e.offsetWidth,b=t+e.offsetHeight;if(l<0||t<0||r>864||b>1254)issues.push(`越界：${e.dataset.id}`);if(parseFloat(getComputedStyle(e).fontSize)<10)issues.push(`字号偏小：${e.dataset.id}`)});const nodes=[...paper.querySelectorAll('.node')];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];const ar={l:a.offsetLeft,t:a.offsetTop,r:a.offsetLeft+a.offsetWidth,b:a.offsetTop+a.offsetHeight};const br={l:b.offsetLeft,t:b.offsetTop,r:b.offsetLeft+b.offsetWidth,b:b.offsetTop+b.offsetHeight};if(ar.l<br.r&&ar.r>br.l&&ar.t<br.b&&ar.b>br.t)issues.push(`可能重叠：${a.dataset.id} ↔ ${b.dataset.id}`)}$('diagnostic').innerHTML=issues.length?issues.slice(0,15).map(x=>`<div class="issue">⚠️ ${x}</div>`).join('')+`<div class="issue"><b>共 ${issues.length} 项</b></div>`:'<div class="status good">✓ 未发现明显越界、小字号或元素重叠问题</div>';}
