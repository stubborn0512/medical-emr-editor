<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医疗文书编辑器 Demo</title><style>html,body{margin:0;height:100%;font-family:Arial,"Microsoft YaHei",sans-serif;background:#eef1f5;color:#222}*{box-sizing:border-box}.top{height:58px;background:#20252b;color:#fff;display:flex;align-items:center;padding:0 16px;gap:12px}.top b{font-size:18px}.badge{background:#8b1e1e;border-radius:999px;padding:4px 9px;font-size:12px}.layout{display:grid;grid-template-columns:290px 1fr 300px;height:calc(100vh - 58px)}.side{background:#fff;border-right:1px solid #d8dde4;overflow:auto;padding:14px}.right{border-right:0;border-left:1px solid #d8dde4}.group{margin-bottom:18px}.group h3{font-size:14px;margin:0 0 9px}.btn{width:100%;padding:8px 10px;border:1px solid #cbd1d8;background:#fafbfc;border-radius:6px;margin-bottom:6px;text-align:left;cursor:pointer}.btn.active{border-color:#4777c9;background:#eef4ff}.toolbar{margin-left:auto;display:flex;gap:6px}.toolbar button{padding:7px 10px;border:1px solid #59616b;background:#2b3138;color:#fff;border-radius:5px;cursor:pointer}.stage{overflow:auto;padding:30px;display:flex;justify-content:center;align-items:flex-start}.paper{position:relative;width:794px;min-height:1123px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.18);overflow:hidden}.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(-28deg);font-size:60px;font-weight:700;color:rgba(170,0,0,.10);pointer-events:none;z-index:30}.node{position:absolute;z-index:10;white-space:pre-wrap;outline:none;cursor:text}.node.sel{outline:1px dashed #4777c9;background:rgba(71,119,201,.04)}.line{position:absolute;height:1px;background:#111;z-index:5}.soft{position:absolute;height:1px;background:#aaa;z-index:5}.field{width:100%;padding:7px;border:1px solid #cfd5dc;border-radius:5px}.prop{display:grid;grid-template-columns:1fr 1fr;gap:8px}.prop label{font-size:12px;color:#666}.prop input,.prop select{width:100%;padding:7px;border:1px solid #cfd5dc;border-radius:5px;margin-top:4px}.hint{font-size:12px;line-height:1.6;color:#666;background:#f7f8fa;padding:8px;border-radius:6px}.meta{font-size:12px;color:#666;line-height:1.7}.divider{height:1px;background:#e5e8ec;margin:12px 0}@media(max-width:1100px){.layout{grid-template-columns:250px 1fr}.right{display:none}}</style></head><body><header class="top"><b>医疗文书模板编辑器</b><span class="badge">仅用于界面/排版演示 · 非真实医疗文书</span><div class="toolbar"><button onclick="addText()">＋文字</button><button onclick="undo()">撤销</button><button onclick="redo()">重做</button><button onclick="save()">保存</button><button onclick="printDoc()">打印</button></div></header><div class="layout"><aside class="side"><div class="group"><h3>报告模板</h3><button class="btn active" onclick="useTemplate('ct')">螺旋CT检查报告单</button><button class="btn" onclick="useTemplate('us')">超声检查报告单</button></div><div class="group"><h3>文档元素</h3><div id="list"></div></div><div class="group"><h3>提示</h3><div class="hint">点击文字可直接编辑；拖动文字可调整位置；右侧可精确修改字体、字号和坐标。示例数据均为虚构或脱敏数据。</div></div></aside><main class="stage"><div class="paper" id="paper"><div class="wm">DEMO · 非真实医疗文书</div></div></main><aside class="side right"><div class="group"><h3>选中元素</h3><div class="prop"><div style="grid-column:1/-1"><label>文本</label><input id="txt"></div><div><label>字体</label><select id="font"><option>SimSun</option><option>Microsoft YaHei</option><option>SimHei</option><option>KaiTi</option><option>Arial</option></select></div><div><label>字号</label><input id="size" type="number" min="8" max="72"></div><div><label>字重</label><select id="weight"><option value="400">常规</option><option value="700">粗体</option></select></div><div><label>左</label><input id="left" type="number"></div><div><label>上</label><input id="top" type="number"></div><div><label>宽</label><input id="width" type="number"></div><div><label>高</label><input id="height" type="number"></div></div><div class="divider"></div><button class="btn" onclick="duplicate()">复制元素</button><button class="btn" onclick="removeNode()">删除元素</button></div><div class="group"><h3>状态</h3><div class="meta" id="status">未选择元素</div></div></aside></div><script>let selected=null,history=[],future=[];const paper=document.getElementById('paper');const list=document.getElementById('list');function snap(){return [...paper.querySelectorAll('.node')].map(e=>({text:e.innerText,style:e.getAttribute('style'),id:e.dataset.id}))}function push(){history.push(JSON.stringify(snap()));if(history.length>50)history.shift();future=[]}function apply(data){paper.querySelectorAll('.node').forEach(e=>e.remove());data.forEach(x=>{const e=document.createElement('div');e.className='node';e.dataset.id=x.id;e.innerText=x.text;e.setAttribute('style',x.style);bind(e);paper.appendChild(e)});selected=null;refresh()}function undo(){if(!history.length)return;future.push(JSON.stringify(snap()));apply(JSON.parse(history.pop()));}function redo(){if(!future.length)return;history.push(JSON.stringify(snap()));apply(JSON.parse(future.pop()));}function bind(e){e.addEventListener('click',ev=>{ev.stopPropagation();select(e)});e.addEventListener('input',()=>{if(selected===e)document.getElementById('txt').value=e.innerText});e.draggable=true;e.addEventListener('dragstart',ev=>ev.dataTransfer.setData('text/plain',e.dataset.id));e.addEventListener('dragend',ev=>{const r=paper.getBoundingClientRect();e.style.left=(ev.clientX-r.left+paper.scrollLeft-10)+'px';e.style.top=(ev.clientY-r.top+paper.scrollTop-10)+'px';select(e);push()})}paper.addEventListener('dragover',e=>e.preventDefault());paper.addEventListener('click',()=>select(null));function addText(){push();const e=document.createElement('div');e.className='node';e.dataset.id='t'+Date.now();e.style='left:120px;top:220px;width:260px;font:14px SimSun;';e.contentEditable='true';e.innerText='新文字';bind(e);paper.appendChild(e);select(e)}function select(e){if(selected)selected.classList.remove('sel');selected=e;if(!e){document.getElementById('status').innerText='未选择元素';refresh();return}e.classList.add('sel');document.getElementById('txt').value=e.innerText;document.getElementById('font').value=getComputedStyle(e).fontFamily.split(',')[0].replaceAll('"','');document.getElementById('size').value=parseInt(getComputedStyle(e).fontSize);document.getElementById('weight').value=getComputedStyle(e).fontWeight;document.getElementById('left').value=parseInt(e.style.left)||e.offsetLeft;document.getElementById('top').value=parseInt(e.style.top)||e.offsetTop;document.getElementById('width').value=parseInt(e.style.width)||e.offsetWidth;document.getElementById('height').value=parseInt(e.style.height)||e.offsetHeight;document.getElementById('status').innerText='已选择：'+e.dataset.id;refresh()}function refresh(){list.innerHTML='';[...paper.querySelectorAll('.node')].forEach((e,i)=>{const b=document.createElement('button');b.className='btn'+(e===selected?' active':'');b.innerText=(i+1)+'. '+e.dataset.id;b.onclick=()=>select(e);list.appendChild(b)})}function set(id,fn){document.getElementById(id).addEventListener('input',()=>{if(!selected)return;fn(selected,document.getElementById(id).value);refresh()})}set('txt',(e,v)=>e.innerText=v);set('font',(e,v)=>e.style.fontFamily=v);set('size',(e,v)=>e.style.fontSize=v+'px');set('weight',(e,v)=>e.style.fontWeight=v);set('left',(e,v)=>e.style.left=v+'px');set('top',(e,v)=>e.style.top=v+'px');set('width',(e,v)=>e.style.width=v+'px');set('height',(e,v)=>e.style.height=v+'px');function duplicate(){if(!selected)return;push();const e=selected.cloneNode(true);e.dataset.id=selected.dataset.id+'_copy';e.style.left=(selected.offsetLeft+15)+'px';e.style.top=(selected.offsetTop+15)+'px';bind(e);paper.appendChild(e);select(e)}function removeNode(){if(!selected)return;push();selected.remove();selected=null;refresh()}function save(){localStorage.setItem('medical_editor_demo',JSON.stringify(snap()));alert('布局已保存到本浏览器。')}function printDoc(){window.print()}function useTemplate(type){push();paper.querySelectorAll('.node,.line,.soft').forEach(e=>e.remove());if(type==='ct'){add('hospital','郑州某某医院（示例）','left:190px;top:30px;width:414px;text-align:center;font:700 23px SimSun');add('title','螺旋CT检查报告单（示例）','left:220px;top:70px;width:354px;text-align:center;font:700 16px SimSun');line(55,100,739);add('b1','姓名：匿名患者　　性别：男　　年龄：27岁','left:55px;top:115px;width:330px;font:14px SimSun');add('b2','影像号：DEMO-000001','left:470px;top:115px;width:250px;font:14px SimSun');add('b3','科室：门诊外科　　　　　　　　　就诊日期：2026-01-01','left:55px;top:145px;width:665px;font:14px SimSun');add('b4','门诊号：DEMO-000002　　　　　　报告日期：2026-01-01','left:55px;top:175px;width:665px;font:14px SimSun');line(55,205,739);add('item','检查名称：16排CT平扫\n检查部位：腰椎椎间盘','left:55px;top:220px;width:665px;font:14px SimSun;line-height:1.6');line(55,285,739);add('fx','影像表现：','left:55px;top:305px;width:110px;font:700 14px SimSun');add('body','腰椎生理曲度存在，排列可，L4-5、L5-S1椎间盘变扁，L4-5椎间盘偏左、L5-S1椎间盘偏左；椎管前后径改变。','left:55px;top:335px;width:680px;font:14px SimSun;line-height:1.85');add('yx','印象：','left:55px;top:760px;width:80px;font:700 14px SimSun');add('imp','1. L4-5椎间盘突出、偏左\n2. L5-S1椎间盘突出、偏左\n请结合临床及其他相关检查','left:55px;top:790px;width:500px;font:14px SimSun;line-height:1.8');line(55,1005,739);add('footer','报告医师：示例　　　　　　　　　审核医师：示例','left:250px;top:1020px;width:480px;font:14px SimSun');add('note','（此报告仅用于界面/排版演示，不作医疗凭证）','left:160px;top:1060px;width:520px;text-align:center;font:11px SimSun;color:#777')}else{add('hospital','某某大学附属医院（示例）','left:190px;top:35px;width:414px;text-align:center;font:700 23px SimSun');add('title','超声检查报告单（示例）','left:220px;top:75px;width:354px;text-align:center;font:700 16px SimSun');line(55,105,739);add('basic','姓名：匿名患者　　性别：男　　年龄：17岁　　检查号：DEMO-000001','left:55px;top:120px;width:680px;font:14px SimSun');add('clinical','临床诊断：示例','left:55px;top:150px;width:680px;font:14px SimSun');add('item','检查项目：双肾及输尿管膀胱超声（示例）','left:55px;top:180px;width:680px;font:14px SimSun');line(55,215,739);add('t1','超声所见：','left:55px;top:235px;width:100px;font:700 14px SimSun');add('t2','这里放置超声所见示例文字，用于演示排版、字体和位置调整。','left:55px;top:270px;width:680px;font:14px SimSun;line-height:1.8');add('t3','超声提示：','left:55px;top:470px;width:100px;font:700 14px SimSun');add('t4','① 示例项目一\n② 示例项目二\n③ 示例项目三','left:55px;top:505px;width:680px;font:14px SimSun;line-height:1.8')}refresh()}function add(id,text,style){const e=document.createElement('div');e.className='node';e.dataset.id=id;e.innerText=text;e.setAttribute('style',style);bind(e);paper.appendChild(e)}function line(l,t,r){const e=document.createElement('div');e.className='line';e.style=`left:${l}px;top:${t}px;width:${r-l}px`;paper.appendChild(e)}useTemplate('ct');</script></body></html>
