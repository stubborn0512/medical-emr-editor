<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医疗文书模板编辑器</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#eef1f5;color:#222;font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}button,input,select{font:inherit}.app{height:100%;display:flex;flex-direction:column}.topbar{height:50px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#24282e;color:#fff;border-bottom:1px solid #111}.brand{font-weight:700;font-size:15px;padding:0 10px 0 3px;white-space:nowrap}.badge{font-size:11px;background:#8b1e1e;padding:4px 8px;border-radius:10px;white-space:nowrap}.tb{height:30px;min-width:32px;border:0;border-radius:4px;background:#31363d;color:#fff;cursor:pointer;padding:0 9px}.tb:hover{background:#3e454e}.tb.on{background:#4a78c9}.sep{width:1px;height:22px;background:#4b5159;margin:0 2px}.spacer{flex:1}.main{flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr 270px}.panel{background:#fff;min-width:0;overflow:auto}.left{border-right:1px solid #d7dce2}.right{border-left:1px solid #d7dce2;padding:12px}.section{padding:12px 12px 0}.section h3{margin:0 0 8px;font-size:13px}.sub{font-size:11px;color:#8a9099;margin:-3px 0 8px}.item{width:100%;border:1px solid #d7dce2;background:#fafbfc;border-radius:5px;padding:7px 9px;margin-bottom:5px;text-align:left;cursor:pointer;font-size:12px}.item:hover{background:#f2f5f9}.item.active{background:#eef4ff;border-color:#4777c9}.tree{border-left:1px solid #e1e5e9;margin-left:7px;padding-left:8px}.tree .item{font-size:11px}.stage{overflow:auto;padding:28px 32px;display:flex;justify-content:center;align-items:flex-start;background:#f0f2f5}.paper{position:relative;width:794px;height:1123px;flex:none;background:#fff;box-shadow:0 3px 20px rgba(0,0,0,.18);overflow:hidden}.paper.readonly .edit-node{cursor:default}.watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:100;transform:rotate(-31deg);font-size:68px;font-weight:700;letter-spacing:8px;color:rgba(185,30,30,.09)}.edit-node{position:absolute;z-index:20;white-space:pre-wrap;outline:none;min-width:8px;min-height:18px;cursor:text}.edit-node.selected{outline:1px dashed #4a79c6;background:rgba(74,121,198,.035)}.rule{position:absolute;height:1px;background:#111;z-index:10}.toolbar2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.mini{border:1px solid #cdd3da;background:#fff;border-radius:5px;padding:6px 9px;font-size:11px;cursor:pointer}.mini:hover{background:#f5f7f9}.propgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.propgrid>div.full{grid-column:1/-1}.propgrid label{display:block;font-size:11px;color:#666}.propgrid input,.propgrid select{width:100%;margin-top:3px;padding:6px;border:1px solid #cdd3da;border-radius:4px;background:#fff}.note{font-size:11px;line-height:1.6;color:#6d737c;background:#f7f8fa;border:1px solid #e3e6ea;padding:8px;border-radius:5px}.status{font-size:11px;color:#666;line-height:1.7}.pill{display:inline-block;padding:2px 6px;border-radius:10px;background:#edf2f7;margin:0 3px 3px 0}.font-ok{color:#27764a}.font-warn{color:#9b6b00}@media(max-width:1000px){.main{grid-template-columns:210px 1fr}.right{display:none}}@media print{html,body{overflow:visible;background:#fff}.topbar,.left,.right{display:none}.main{display:block}.stage{padding:0;background:#fff}.paper{box-shadow:none;margin:0}.watermark{display:flex}}
</style></head><body><div class="app"><header class="topbar"><div class="brand">医疗文书模板编辑器</div><span class="badge">仅用于界面/排版演示 · 非真实医疗文书</span><div class="sep"></div><button class="tb" onclick="undo()">↶</button><button class="tb" onclick="redo()">↷</button><div class="sep"></div><button class="tb" onclick="toggleReadonly()">只读</button><button class="tb" onclick="toggleRevision()">修订</button><button class="tb" onclick="insertText()">文字</button><button class="tb" onclick="insertData('time')">时间</button><button class="tb" onclick="insertData('single')">单选</button><button class="tb" onclick="insertData('select')">下拉</button><button class="tb" onclick="insertTable()">表格</button><button class="tb" onclick="toggleWatermark()">水印</button><div class="spacer"></div><button class="tb" onclick="saveLayout()">保存</button><button class="tb" onclick="loadLayout()">载入</button><button class="tb" onclick="window.print()">打印</button></header><div class="main"><aside class="panel left"><div class="section"><h3>报告模板</h3><div class="sub">选择模板后可继续编辑</div><button class="item active" id="ctBtn" onclick="useTemplate('ct')">螺旋CT检查报告单</button><button class="item" id="usBtn" onclick="useTemplate('us')">超声检查报告单</button></div><div class="section"><h3>文档结构</h3><div id="tree" class="tree"></div></div><div class="section"><h3>数据元</h3><button class="item" onclick="insertData('text')">文本数据元</button><button class="item" onclick="insertData('time')">日期 / 时间</button><button class="item" onclick="insertData('single')">单选数据元</button><button class="item" onclick="insertData('select')">下拉数据元</button><button class="item" onclick="insertTable()">表格</button></div><div class="section" style="padding-bottom:14px"><div class="note">网页字体已接入：Noto Serif SC（宋体风格）与 Noto Sans SC（黑体风格）。无需依赖 Windows 是否安装 SimSun。</div></div></aside><main class="stage"><div class="paper" id="paper"><div class="watermark" id="watermark">DEMO · 非真实医疗文书</div></div></main><aside class="panel right"><div class="section" style="padding:0"><h3>元素属性</h3><div class="toolbar2"><button class="mini" onclick="align('left')">左对齐</button><button class="mini" onclick="align('center')">居中</button><button class="mini" onclick="bold()">加粗</button><button class="mini" onclick="duplicate()">复制</button><button class="mini" onclick="removeNode()">删除</button></div><div class="propgrid"><div class="full"><label>内容</label><input id="txt" oninput="setProp('text',this.value)"></div><div><label>字体</label><select id="font" onchange="setProp('font',this.value)"><option value="Noto Serif SC">宋体（网页字体）</option><option value="Noto Sans SC">黑体（网页字体）</option><option value="SimSun">宋体（系统字体）</option><option value="NSimSun">新宋体（系统字体）</option><option value="FangSong">仿宋（系统字体）</option><option value="KaiTi">楷体（系统字体）</option><option value="Microsoft YaHei">微软雅黑（系统字体）</option><option value="STSong">华文宋体（系统字体）</option><option value="Arial">Arial</option></select></div><div><label>字号</label><input id="size" type="number" min="8" max="72" onchange="setProp('size',this.value)"></div><div><label>字重</label><select id="weight" onchange="setProp('weight',this.value)"><option value="400">常规</option><option value="500">中等</option><option value="600">半粗</option><option value="700">粗体</option><option value="900">特粗</option></select></div><div><label>行高</label><input id="line" type="number" step="0.1" min="1" max="3" onchange="setProp('line',this.value)"></div><div><label>左(px)</label><input id="left" type="number" onchange="setProp('left',this.value)"></div><div><label>上(px)</label><input id="top" type="number" onchange="setProp('top',this.value)"></div><div><label>宽(px)</label><input id="width" type="number" onchange="setProp('width',this.value)"></div><div><label>高(px)</label><input id="height" type="number" onchange="setProp('height',this.value)"></div></div></div><div class="section" style="padding:14px 0 0"><h3>编辑状态</h3><div id="status" class="status">未选择元素</div></div><div class="section" style="padding:14px 0 0"><h3>字体状态</h3><div id="fontStatus" class="status"><span class="font-warn">字体正在加载……</span></div></div></aside></div></div><script>
const paper=document.getElementById('paper'),tree=document.getElementById('tree'),wm=document.getElementById('watermark');let selected=null,history=[],future=[],readonly=false,revision=false,waterOn=true;const WEB_SERIF='Noto Serif SC',WEB_SANS='Noto Sans SC';
function pushHistory(){history.push(JSON.stringify(snapshot()));if(history.length>60)history.shift();future=[]}function snapshot(){return [...paper.querySelectorAll('.edit-node')].map(e=>({id:e.dataset.id,text:e.innerText,style:e.getAttribute('style')}))}function restore(data){paper.querySelectorAll('.edit-node,.rule').forEach(e=>e.remove());data.forEach(x=>{const e=document.createElement('div');e.className='edit-node';e.dataset.id=x.id;e.innerText=x.text;e.setAttribute('style',x.style||'');e.contentEditable=!readonly;e.draggable=!readonly;bind(e);paper.appendChild(e)});selected=null;refreshTree()}function undo(){if(!history.length)return;future.push(JSON.stringify(snapshot()));restore(JSON.parse(history.pop()))}function redo(){if(!future.length)return;history.push(JSON.stringify(snapshot()));restore(JSON.parse(future.pop()))}function baseNode(id,text,style){const e=document.createElement('div');e.className='edit-node';e.dataset.id=id;e.innerText=text;e.setAttribute('style',style);e.contentEditable=!readonly;e.draggable=!readonly;bind(e);paper.appendChild(e);return e}function rule(left,top,width){const e=document.createElement('div');e.className='rule';e.style=`left:${left}px;top:${top}px;width:${width}px`;paper.appendChild(e)}function bind(e){e.addEventListener('click',ev=>{ev.stopPropagation();select(e)});e.addEventListener('focus',()=>select(e));e.addEventListener('input',()=>{if(selected===e)document.getElementById('txt').value=e.innerText;refreshTree()});e.addEventListener('dragend',ev=>{if(readonly)return;const r=paper.getBoundingClientRect();e.style.left=Math.round(ev.clientX-r.left-8)+'px';e.style.top=Math.round(ev.clientY-r.top-8)+'px';select(e);pushHistory()})}paper.addEventListener('click',()=>select(null));function select(e){if(selected)selected.classList.remove('selected');selected=e;if(!e){document.getElementById('status').innerText='未选择元素';refreshTree();return}e.classList.add('selected');const s=getComputedStyle(e);document.getElementById('txt').value=e.innerText;let fam=(s.fontFamily||WEB_SERIF).split(',')[0].replaceAll('"','').trim();document.getElementById('font').value=[...document.getElementById('font').options].some(o=>o.value===fam)?fam:WEB_SERIF;document.getElementById('size').value=parseInt(s.fontSize);document.getElementById('weight').value=s.fontWeight;document.getElementById('line').value=s.lineHeight==='normal'?1.5:(parseFloat(s.lineHeight)/parseFloat(s.fontSize)).toFixed(1);document.getElementById('left').value=parseInt(e.style.left)||e.offsetLeft;document.getElementById('top').value=parseInt(e.style.top)||e.offsetTop;document.getElementById('width').value=parseInt(e.style.width)||e.offsetWidth;document.getElementById('height').value=parseInt(e.style.height)||e.offsetHeight;document.getElementById('status').innerHTML='<span class="pill">'+e.dataset.id+'</span> 可编辑元素';refreshTree()}function refreshTree(){tree.innerHTML='';[...paper.querySelectorAll('.edit-node')].forEach((e,i)=>{const b=document.createElement('button');b.className='item'+(e===selected?' active':'');b.textContent=(i+1)+'. '+e.dataset.id;b.onclick=()=>select(e);tree.appendChild(b)})}function setProp(type,v){if(!selected)return;pushHistory();if(type==='text')selected.innerText=v;if(type==='font')selected.style.fontFamily=v;if(type==='size')selected.style.fontSize=v+'px';if(type==='weight')selected.style.fontWeight=v;if(type==='line')selected.style.lineHeight=v;if(type==='left')selected.style.left=v+'px';if(type==='top')selected.style.top=v+'px';if(type==='width')selected.style.width=v+'px';if(type==='height')selected.style.height=v+'px';refreshTree()}function align(a){if(!selected)return;pushHistory();selected.style.textAlign=a}function bold(){if(!selected)return;pushHistory();selected.style.fontWeight=getComputedStyle(selected).fontWeight==='700'?'400':'700'}function duplicate(){if(!selected)return;pushHistory();const e=selected.cloneNode(true);e.dataset.id=selected.dataset.id+'_copy';e.style.left=(selected.offsetLeft+18)+'px';e.style.top=(selected.offsetTop+18)+'px';bind(e);paper.appendChild(e);select(e)}function removeNode(){if(!selected)return;pushHistory();selected.remove();selected=null;refreshTree()}function insertText(){pushHistory();select(baseNode('text_'+Date.now(),'新文字',`left:140px;top:300px;width:180px;font-family:"${WEB_SERIF}";font-size:14px;line-height:1.6`))}function insertData(type){pushHistory();let t=type==='time'?'2026-09-14 18:00':type==='single'?'【单选：男】':type==='select'?'【下拉：请选择】':'【文本数据元】';select(baseNode('data_'+Date.now(),t,`left:140px;top:340px;width:220px;font-family:"${WEB_SERIF}";font-size:14px`))}function insertTable(){pushHistory();select(baseNode('table_'+Date.now(),'表格数据元\n┌────────┬────────┐\n│ 字段 1 │ 字段 2 │\n├────────┼────────┤\n│ 示例   │ 示例   │\n└────────┴────────┘',`left:140px;top:380px;width:360px;font-family:"${WEB_SERIF}";font-size:13px;line-height:1.5`))}function toggleReadonly(){readonly=!readonly;paper.classList.toggle('readonly',readonly);paper.querySelectorAll('.edit-node').forEach(e=>{e.contentEditable=!readonly;e.draggable=!readonly})}function toggleRevision(){revision=!revision;document.querySelectorAll('.tb').forEach(b=>{if(b.textContent==='修订')b.classList.toggle('on',revision)})}function toggleWatermark(){waterOn=!waterOn;wm.style.display=waterOn?'flex':'none'}function saveLayout(){localStorage.setItem('medical_editor_layout_v5',JSON.stringify({nodes:snapshot(),watermark:waterOn}));alert('布局已保存到当前浏览器。')}function loadLayout(){const raw=localStorage.getItem('medical_editor_layout_v5');if(!raw){alert('尚未保存布局。');return}const d=JSON.parse(raw);restore(d.nodes||[]);waterOn=d.watermark!==false;wm.style.display=waterOn?'flex':'none'}function useTemplate(type){pushHistory();paper.querySelectorAll('.edit-node,.rule').forEach(e=>e.remove());document.getElementById('ctBtn').classList.toggle('active',type==='ct');document.getElementById('usBtn').classList.toggle('active',type==='us');if(type==='ct'){baseNode('hospital','郑州某某医院（示例）',`left:190px;top:29px;width:414px;text-align:center;font-family:"${WEB_SERIF}";font-size:23px;font-weight:700`);baseNode('title','螺旋CT检查报告单（示例）',`left:220px;top:67px;width:354px;text-align:center;font-family:"${WEB_SERIF}";font-size:16px;font-weight:700`);rule(55,99,684);baseNode('basic1','姓名：匿名患者　　性别：男　　年龄：27岁',`left:55px;top:115px;width:360px;font-family:"${WEB_SERIF}";font-size:13px`);baseNode('basic2','影像号：DEMO-000001',`left:470px;top:115px;width:245px;font-family:"${WEB_SERIF}";font-size:13px`);baseNode('basic3','科室：门诊外科　　　　　　　　　就诊日期：2026-01-01',`left:55px;top:144px;width:665px;font-family:"${WEB_SERIF}";font-size:13px`);baseNode('basic4','门诊号：DEMO-000002　　　　　　报告日期：2026-01-01',`left:55px;top:174px;width:665px;font-family:"${WEB_SERIF}";font-size:13px`);rule(55,204,684);baseNode('item','检查名称：16排CT平扫\n检查部位：腰椎椎间盘',`left:55px;top:221px;width:665px;font-family:"${WEB_SERIF}";font-size:13px;line-height:1.65`);rule(55,281,684);baseNode('findTitle','影像表现：',`left:55px;top:300px;width:100px;font-family:"${WEB_SERIF}";font-size:13px;font-weight:700`);baseNode('findings','腰椎生理曲度存在，排列可，L4-5、L5-S1椎间盘变扁，L4-5椎间盘偏左、L5-S1椎间盘偏左；椎管前后径改变。',`left:55px;top:330px;width:680px;font-family:"${WEB_SERIF}";font-size:13px;line-height:1.75`);baseNode('impressionTitle','印象：',`left:55px;top:760px;width:80px;font-family:"${WEB_SERIF}";font-size:13px;font-weight:700`);baseNode('impression','1. L4-5椎间盘突出、偏左\n2. L5-S1椎间盘突出、偏左\n请结合临床及其他相关检查',`left:55px;top:790px;width:500px;font-family:"${WEB_SERIF}";font-size:13px;line-height:1.8`);rule(55,1006,684);baseNode('footer','报告医师：示例　　　　　　　　　审核医师：示例',`left:250px;top:1019px;width:480px;font-family:"${WEB_SERIF}";font-size:13px`);baseNode('note','（此页面仅用于界面/排版演示，不作医疗凭证）',`left:150px;top:1058px;width:520px;text-align:center;font-family:"${WEB_SERIF}";font-size:10px;color:#777`)}else{baseNode('hospital','某某大学附属医院（示例）',`left:190px;top:30px;width:414px;text-align:center;font-family:"${WEB_SERIF}";font-size:23px;font-weight:700`);baseNode('title','超声检查报告单（示例）',`left:220px;top:69px;width:354px;text-align:center;font-family:"${WEB_SERIF}";font-size:16px;font-weight:700`);rule(55,100,684);baseNode('basic','姓名：匿名患者　　性别：男　　年龄：17岁　　检查号：DEMO-000001',`left:55px;top:116px;width:680px;font-family:"${WEB_SERIF}";font-size:13px`);baseNode('clinical','临床诊断：示例',`left:55px;top:146px;width:680px;font-family:"${WEB_SERIF}";font-size:13px`);baseNode('item','检查项目：双肾及输尿管膀胱超声（示例）',`left:55px;top:176px;width:680px;font-family:"${WEB_SERIF}";font-size:13px`);rule(55,210,684);baseNode('findTitle','超声所见：',`left:55px;top:230px;width:100px;font-family:"${WEB_SERIF}";font-size:13px;font-weight:700`);baseNode('find','这里放置超声所见示例文字，用于演示排版、字体和位置调整。',`left:55px;top:266px;width:680px;font-family:"${WEB_SERIF}";font-size:13px;line-height:1.8`);baseNode('hintTitle','超声提示：',`left:55px;top:470px;width:100px;font-family:"${WEB_SERIF}";font-size:13px;font-weight:700`);baseNode('hint','① 示例项目一\n② 示例项目二\n③ 示例项目三',`left:55px;top:505px;width:680px;font-family:"${WEB_SERIF}";font-size:13px;line-height:1.8`)}refreshTree()}document.fonts.ready.then(()=>{const ok=[...document.fonts].some(f=>f.family==='Noto Serif SC'&&f.status==='loaded');document.getElementById('fontStatus').innerHTML=ok?'<span class="font-ok">✓ Noto Serif SC 已加载</span>':'<span class="font-warn">⚠ 网页字体未加载，使用系统回退</span>'});useTemplate('ct');
</script></body></html>
