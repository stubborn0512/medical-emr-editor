.75`],['footer','报告医师：示例　　　　　　　　　审核医师：示例',`left:300px;top:1132px;width:545px;font-family:${fontStack};font-size:13px`],['note','（本页面仅用于界面/排版演示，不作医疗凭证）',`left:225px;top:1172px;width:500px;text-align:center;font-family:${fontStack};font-size:10px;color:#777`]],us:[['hospital','某某大学附属医院（示例）',`left:180px;top:35px;width:500px;text-align:center;font-family:${fontStack};font-size:25px;font-weight:700`],['title','超声检查报告单（示例）',`left:205px;top:77px;width:455px;text-align:center;font-family:${fontStack};font-size:17px;font-weight:700`],['basic','姓名：匿名患者　　性别：男　　年龄：17岁　　检查号：DEMO-000001',`left:37px;top:130px;width:790px;font-family:${fontStack};font-size:13px`],['clinical','临床诊断：示例',`left:37px;top:164px;width:790px;font-family:${fontStack};font-size:13px`],['item','检查项目：双肾及输尿管膀胱超声（示例）',`left:37px;top:198px;width:790px;font-family:${fontStack};font-size:13px`],['findTitle','超声所见：',`left:37px;top:252px;width:110px;font-family:${fontStack};font-size:14px;font-weight:700`],['find','这里放置超声所见示例文字，用于演示模板编辑、字体控制及位置调整。',`left:37px;top:285px;width:790px;font-family:${fontStack};font-size:13px;line-height:1.8`],['hintTitle','超声提示：',`left:37px;top:520px;width:110px;font-family:${fontStack};font-size:14px;font-weight:700`],['hint','① 示例项目一\n② 示例项目二\n③ 示例项目三',`left:37px;top:553px;width:790px;font-family:${fontStack};font-size:13px;line-height:1.8`]]};
function node(d){const e=document.createElement('div');e.className='node';e.dataset.id=d.id;e.dataset.locked=d.locked?'true':'false';e.innerText=d.text;e.setAttribute('style',d.style||'');e.contentEditable=!readonly;bind(e);paper.appendChild(e);return e}
function rule(id,l,t,w){const e=document.createElement('div');e.className='rule';e.dataset.id=id;e.style=`left:${l}px;top:${t}px;width:${w}px`;paper.appendChild(e);return e}
function locked(e){return e?.dataset.locked==='true'}
function refresh(){const q=search.trim().toLowerCase();tree.innerHTML='';[...paper.querySelectorAll('.node')].filter(e=>!q||e.dataset.id.toLowerCase().includes(q)||e.innerText.toLowerCase().includes(q)).forEach((e,i)=>{const b=document.createElement('button');b.className='item'+(e===selected?' active':'');b.textContent=`${i+1}. ${e.dataset.id}${locked(e)?' 🔒':''}`;b.onclick=()=>select(e);tree.appendChild(b)})}

function use(type,rec=true){if(rec)push();clear();(type==='ct'?T.ct:T.us).forEach(a=>node({id:a[0],text:a[1],style:a[2]}));if(type==='ct'){rule('r1',36,112,806);rule('r2',36,221,806);rule('r3',36,305,806)}else{rule('r1',36,110,806);rule('r2',36,229,806)}document.body.dataset.template=type;ct.classList.toggle('active',type==='ct');us.classList.toggle('active',type==='us');refresh();markDirty();fit()}
function snap(){return[...paper.querySelectorAll('.node,.rule')].map(e=>({kind:e.classList.contains('rule')?'rule':'node',id:e.dataset.id,text:e.innerText||'',style:e.getAttribute('style')||'',locked:locked(e)}))}

function restore(d){paper.querySelectorAll('.node,.rule').forEach(e=>e.remove());d.forEach(x=>x.kind==='rule'?rule(x.id,parseInt(/left:([\d-]+)/.exec(x.style)?.[1]||0),parseInt(/top:([\d-]+)/.exec(x.style)?.[1]||0),parseInt(/width:([\d-]+)/.exec(x.style)?.[1]||0)):node(x));select(null);refresh();fit()}
function undo(){if(!history.length)return;future.push(JSON.stringify(snap()));restore(JSON.parse(history.pop()));update();toast('已撤销')}
function redo(){if(!future.length)return;history.push(JSON.stringify(snap()));restore(JSON.parse(future.pop()));update();toast('已重做')}
function update(){$('undo').disabled=!history.length;$('redo').disabled=!future.length}

function sync(){if(!selected)return;const s=getComputedStyle(selected);$('txt').value=selected.innerText;const fam=s.fontFamily.split(',')[0].replaceAll('"','').trim();$('font').value=[...$('font').options].some(o=>o.value===fam)?fam:'SimSun';$('size').value=parseInt(s.fontSize)||13;$('weight').value=s.fontWeight;$('line').value=s.lineHeight==='normal'?1.5:(parseFloat(s.lineHeight)/parseFloat(s.fontSize)).toFixed(1);$('letter').value=parseFloat(s.letterSpacing)||0;$('left').value=parseInt(selected.style.left)||selected.offsetLeft;$('top').value=parseInt(selected.style.top)||selected.offsetTop;$('width').value=parseInt(selected.style.width)||selected.offsetWidth;$('height').value=parseInt(selected.style.height)||selected.offsetHeight}
function prop(id,fn){$(id).addEventListener('change',()=>{if(!selected||readonly||locked(selected))return;push();fn(selected,$(id).value);sync();box();place();refresh()})}
prop('txt',(e,v)=>e.innerText=v);prop('font',(e,v)=>e.style.fontFamily=v);prop('size',(e,v)=>e.style.fontSize=v+'px');prop('weight',(e,v)=>e.style.fontWeight=v);prop('line',(e,v)=>e.style.lineHeight=v);prop('letter',(e,v)=>e.style.letterSpacing=v+'px');prop('left',(e,v)=>e.style.left=Math.max(0,Number(v)||0)+'px');prop('top',(e,v)=>e.style.top=Math.max(0,Number(v)||0)+'px');prop('width',(e,v)=>e.style.width=Math.max(20,Number(v)||20)+'px');prop('height',(e,v)=>e.style.height=Math.max(16,Number(v)||16)+'px');

function insert(k){if(readonly)return;push();const pos=selected?{x:selected.offsetLeft+24,y:selected.offsetTop+selected.offsetHeight+12}:{x:120,y:220};let d={id:k+'_'+Date.now(),text:'',style:`left:${pos.x}px;top:${pos.y}px;width:300px;font-family:${fontStack};font-size:13px;line-height:1.6`,locked:false};if(k==='text')d.text='新文字';if(k==='time')d.text='2026-01-01 12:00';if(k==='single')d.text='○ 选项A　○ 选项B';if(k==='select')d.text='▼ 请选择';if(k==='table')d.text='字段A　字段B　字段C\n值A　值B　值C';select(node(d));refresh()}

function buildHandles(){handles.innerHTML='';['nw','n','ne','e','se','s','sw','w'].forEach(p=>{const h=document.createElement('div');h.className='handle '+p;h.dataset.p=p;h.addEventListener('pointerdown',startResize);handles.appendChild(h)})}
function box(){if(!selected){selbox.style.display='none';return}selbox.style.display='block';selbox.style.left=selected.offsetLeft+'px';selbox.style.top=selected.offsetTop+'px';selbox.style.width=selected.offsetWidth+'px';selbox.style.height=selected.offsetHeight+'px'}
function place(){handles.querySelectorAll('.handle').forEach(h=>h.classList.remove('show'));if(!selected||readonly||locked(selected))return;const x=selected.offsetLeft,y=selected.offsetTop,w=selected.offsetWidth,h=selected.offsetHeight,P={nw:[x-4,y-4],n:[x+w/2-4,y-4],ne:[x+w-4,y-4],e:[x+w-4,y+h/2-4],se:[x+w-4,y+h-4],s:[x+w/2-4,y+h-4],sw:[x-4,y+h-4],w:[x-4,y+h/2-4]};handles.querySelectorAll('.handle').forEach(a=>{const p=P[a.dataset.p];a.style.left=p[0]+'px';a.style.top=p[1]+'px';a.classList.add('show')})}
function startResize(ev){if(!selected||readonly||locked(selected))return;ev.stopPropagation();ev.preventDefault();resize={e:selected,p:ev.currentTarget.dataset.p,sx:ev.clientX,sy:ev.clientY,l:selected.offsetLeft,t:selected.offsetTop,w:selected.offsetWidth,h:selected.offsetHeight,b:JSON.stringify(snap())};ev.currentTarget.setPointerCapture?.(ev.pointerId)}
paper.addEventListener('pointermove',ev=>{if(!resize)return;const r=resize,dx=(ev.clientX-r.sx)/zoom,dy=(ev.clientY-r.sy)/zoom;let l=r.l,t=r.t,w=r.w,h=r.h;if(r.p.includes('e'))w=r.w+dx;if(r.p.includes('s'))h=r.h+dy;if(r.p.includes('w')){l=r.l+dx;w=r.w-dx}if(r.p.includes('n')){t=r.t+dy;h=r.h-dy}if(w<20){if(r.p.includes('w'))l-=20-w;w=20}if(h<16){if(r.p.includes('n'))t-=16-h;h=16}selected.style.left=Math.max(0,Math.round(l))+'px';selected.style.top=Math.max(0,Math.round(t))+'px';selected.style.width=Math.round(w)+'px';selected.style.height=Math.round(h)+'px';box();place()});paper.addEventListener('pointerup',ev=>{if(!resize)return;resize.e.releasePointerCapture?.(ev.pointerId);history.push(resize.b);future=[];update();markDirty();resize=null;sync();box();place();refresh()});paper.addEventListener('pointercancel',()=>{if(resize){restore(JSON.parse(resize.b));resize=null;select(null)}});
function startDrag(ev){if(ev.button!==0||readonly||locked(ev.currentTarget))return;if(ev.target.classList.contains('handle'))return;const e=ev.currentTarget;drag={e,sx:ev.clientX,sy:ev.clientY,l:e.offsetLeft,t:e.offsetTop,b:JSON.stringify(snap())};e.setPointerCapture?.(ev.pointerId);e.classList.add('dragging');ev.preventDefault()}
paper.addEventListener('pointermove',ev=>{if(!drag||resize)return;const d=drag,dx=(ev.clientX-d.sx)/zoom,dy=(ev.clientY-d.sy)/zoom;let l=d.l+dx,t=d.t+dy;if(snapOn){l=Math.round(l/8)*8;t=Math.round(t/8)*8}d.e.style.left=Math.max(0,Math.min(864-d.e.offsetWidth,Math.round(l)))+'px';d.e.style.top=Math.max(0,Math.min(1254-d.e.offsetHeight,Math.round(t)))+'px';box();place()});paper.addEventListener('pointerup',ev=>{if(!drag||resize)return;drag.e.releasePointerCapture?.(ev.pointerId);drag.e.classList.remove('dragging');history.push(drag.b);future=[];update();markDirty();drag=null;sync();box();place();refresh()});paper.addEventListener('pointercancel',()=>{if(drag){restore(JSON.parse(drag.b));drag=null;select(null)}});
paper.addEventListener('dblclick',ev=>{if(ev.target!==paper||readonly)return;const r=paper.getBoundingClientRect();const x=(ev.clientX-r.left)/zoom,y=(ev.clientY-r.top)/zoom;push();select(node({id:'text_'+Date.now(),text:'新文字',style:`left:${Math.round(x)}px;top:${Math.round(y)}px;width:220px;font-family:${fontStack};font-size:13px;line-height:1.6`,locked:false}))});
function fit(){const a=stage.clientWidth-48;zoom=Math.min(1,Math.max(.25,a/864));applyZoom()}function applyZoom(){stagein.style.width=864*zoom+'px';stagein.style.height=1254*zoom+'px';paper.style.transform=`scale(${zoom})`;box();place();$('z100').textContent=Math.round(zoom*100)+'%'}function setZoom(v){zoom=Math.min(2,Math.max(.25,v));applyZoom()}$('fit').onclick=fit;$('zm').onclick=()=>setZoom(zoom-.1);$('zp').onclick=()=>setZoom(zoom+.1);$('z100').onclick=()=>setZoom(1);stage.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(zoom+(e.deltaY<0?.1:-.1))}},{passive:false});$('snap').onclick=()=>{snapOn=!snapOn;$('snap').classList.toggle('on',snapOn);toast(snapOn?'已开启8px吸附':'已关闭吸附')};
$('readonly').onclick=()=>{readonly=!readonly;paper.querySelectorAll('.node').forEach(e=>e.contentEditable=!readonly);$('readonly').classList.toggle('on',readonly);place();toast(readonly?'已进入只读':'已退出只读')};$('revision').onclick=()=>toast('修订模式用于界面演示');$('water').onclick=()=>toast('演示版始终保留打印水印');$('ct').onclick=()=>use('ct');$('us').onclick=()=>use('us');$('undo').onclick=undo;$('redo').onclick=redo;
function markDirty(){clearTimeout(saveTimer);$('saveState').textContent='● 有未保存修改';$('saveState').style.color='#e0a44a';saveTimer=setTimeout(()=>{try{localStorage.setItem('medical_emr_editor_autosave',JSON.stringify({template:document.body.dataset.template||'ct',nodes:snap(),version:10}));$('saveState').textContent='● 自动保存';$('saveState').style.color='#8dc7a5'}catch{$('saveState').textContent='● 保存失败';$('saveState').style.color='#c95c5c'}},600)}
$('save').onclick=()=>{try{localStorage.setItem('medical_emr_editor_v10',JSON.stringify({template:document.body.dataset.template||'ct',nodes:snap(),version:10}));localStorage.setItem('medical_emr_editor_autosave',JSON.stringify({template:document.body.dataset.template||'ct',nodes:snap(),version:10}));$('saveState').textContent='● 已保存';$('saveState').style.color='#b9c2cd';toast('已保存')}catch{toast('保存失败')}};
$('load').onclick=()=>{const raw=localStorage.getItem('medical_emr_editor_v10')||localStorage.getItem('medical_emr_editor_autosave');if(!raw){toast('没有保存内容');return}try{const d=JSON.parse(raw);document.body.dataset.template=d.template||'ct';restore(d.nodes||[]);ct.classList.toggle('active',document.body.dataset.template==='ct');us.classList.toggle('active',document.body.dataset.template==='us');toast('已载入')}catch{toast('保存数据损坏')}};
$('print').onclick=()=>{watermark.style.display='flex';window.print()};$('check').onclick=check;$('export').onclick=()=>openModal('导出布局',JSON.stringify({template:document.body.dataset.template||'ct',nodes:snap(),watermark:true,version:10},null,2));
function check(){const issues=[],ns=[...paper.querySelectorAll('.node')];ns.forEach(e=>{const l=e.offsetLeft,t=e.offsetTop,r=l+e.offsetWidth,b=t+e.offsetHeight;if(l<0||t<0||r>864||b>1254)issues.push('越界：'+e.dataset.id);if(parseFloat(getComputedStyle(e).fontSize)<10)issues.push('字号偏小：'+e.dataset.id)});for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){if(issues.length>20)break;const a=ns[i].getBoundingClientRect(),b=ns[j].getBoundingClientRect();if(a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top)issues.push('可能重叠：'+ns[i].dataset.id+' ↔ '+ns[j].dataset.id)}$('diag').innerHTML=issues.length?issues.slice(0,12).map(x=>`⚠ ${x}`).join('<br>')+`<br><b>共${issues.length}项</b>`:'<span style="color:#23734a">✓ 未发现明显问题</span>'}
function openModal(t,x){$('mtitle').textContent=t;$('mtext').value=x;$('modal').classList.add('show')}$('mx').onclick=()=>$('modal').classList.remove('show');$('mc').onclick=async()=>{try{await navigator.clipboard.writeText($('mtext').value);toast('已复制')}catch{toast('复制失败')}};$('md').onclick=()=>{const b=new Blob([$('mtext').value],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='medical-emr-layout.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('modal').classList.remove('show')};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1500)}
function bind(e){e.addEventListener('pointerdown',startDrag);e.addEventListener('click',ev=>{ev.stopPropagation();select(e)});e.addEventListener('dblclick',ev=>{ev.stopPropagation();if(!readonly&&!locked(e)){e.focus()}});e.addEventListener('input',()=>{if(selected===e){sync();markDirty();refresh()}})}
paper.addEventListener('click',()=>select(null));document.addEventListener('keydown',e=>{const editing=!!document.activeElement?.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if(e.ctrlKey&&e.key.toLowerCase()==='z'&&!editing){e.preventDefault();undo()}else if(e.ctrlKey&&e.key.toLowerCase()==='y'&&!editing){e.preventDefault();redo()}else if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();$('save').click()}else if(e.ctrlKey&&e.key.toLowerCase()==='c'&&selected&&!editing){e.preventDefault();clipboardNode={text:selected.innerText,style:selected.getAttribute('style')}}else if(e.ctrlKey&&e.key.toLowerCase()==='v'&&!editing&&clipboardNode){e.preventDefault();push();const e2=node({id:'paste_'+Date.now(),text:clipboardNode.text,style:clipboardNode.style,locked:false});e2.style.left=((selected?.offsetLeft)||120)+24+'px';e2.style.top=((selected?.offsetTop)||300)+24+'px';select(e2)}else if(e.key==='Escape'){if(editing)document.activeElement.blur();else select(null)}else if(e.key==='Delete'&&selected&&!readonly&&!editing){$('del').click()}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)&&selected&&!readonly&&!locked(selected)&&!editing){e.preventDefault();push();const s=e.shiftKey?8:1,dx=e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0,dy=e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0;selected.style.left=Math.max(0,selected.offsetLeft+dx)+'px';selected.style.top=Math.max(0,selected.offsetTop+dy)+'px';sync();box();place();markDirty()}});
$('q').addEventListener('input',e=>{search=e.target.value;refresh()});window.addEventListener('resize',fit);buildHandles();use('ct',false);fit();check();update();
if(document.fonts?.ready)document.fonts.ready.then(()=>{$('fstatus').innerHTML=document.fonts.check?.('13px "SimSun"')?'<span style="color:#23734a">✓ 可调用 SimSun / 宋体</span>':'<span style="color:#9b7000">⚠ 当前环境未检测到 SimSun，将按字体栈回退</span>'});
})();
