name: Fix CT layout once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[fix-layout]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix overlapping field widths
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="['basic6','住院号：DEMO-000002','left:271px;top:163px;width:170px;"
          new="['basic6','住院号：DEMO-000002','left:271px;top:163px;width:150px;"
          if old not in s:
              raise SystemExit('target layout string not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not blocks: raise SystemExit('no script block')
          Path('/tmp/editor.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/editor.js
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: CT template field overlap [fix-layout]"
          git push