name: Validate editor

# Regression trigger: validate the latest deployed modal layout fix.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              '<!doctype html>',
              'id="paper"', 'id="ct"', 'id="us"',
              'id="print"', 'id="save"', 'id="load"',
              'id="smart"', 'id="smartModal"'
          ]
          missing = [x for x in required if x.lower() not in s.lower()]
          if missing:
              raise SystemExit('Missing required markers: ' + ', '.join(missing))
          if s.lower().count('<html') != 1 or s.lower().count('</html>') != 1:
              raise SystemExit('Unexpected html tag count')
          if s.lower().count('<body') != 1 or s.lower().count('</body>') != 1:
              raise SystemExit('Unexpected body tag count')
          if 'editor modal layout fix' not in s:
              raise SystemExit('Modal layout regression CSS marker missing')
          print('HTML structure checks passed')
          PY

      - name: Validate inline editor script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          if len(blocks) != 1:
              raise SystemExit(f'Expected exactly 1 inline script block, got {len(blocks)}')
          Path('/tmp/editor.js').write_text(blocks[0], encoding='utf-8')
          print('Inline script extracted')
          PY
          node --check /tmp/editor.js
          echo 'Inline editor JavaScript syntax passed'

      - name: Validate smart-identify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -f smart-identify.js
          node --check smart-identify.js
          echo 'smart-identify.js syntax check passed'

      - name: Check required workflow hooks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'branches: \[main\]' .github/workflows/validate.yml
          echo 'Workflow hooks present'
