name: Validate editor
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure site password gate is wired
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '<script src="site-password.js"></script>' index.html; then
            python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); p.write_text(s.replace('</body>','<script src=\"site-password.js\"></script></body>',1),encoding='utf-8')"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'feat: wire site password gate'
            git push
          fi
      - name: Ensure handwriting signature control is wired
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '<script src="signature.js"></script>' index.html; then
            python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); p.write_text(s.replace('</body>','<script src=\"signature.js\"></script></body>',1),encoding='utf-8')"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'feat: wire handwriting signature control'
            git push
          fi
      - name: Validate HTML structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['<!doctype html>','id="paper"','id="ct"','id="us"','id="print"','id="save"','id="load"','id="smart"','id="smartModal"','half-page subhealth layout safe','half-page subhealth behavior safe','site-password.js','signature.js']
          missing=[x for x in required if x.lower() not in s.lower()]
          if missing: raise SystemExit('Missing required markers: '+', '.join(missing))
          if s.lower().count('<html')!=1 or s.lower().count('</html>')!=1: raise SystemExit('Unexpected html tag count')
          if s.lower().count('<body')!=1 or s.lower().count('</body>')!=1: raise SystemExit('Unexpected body tag count')
          if 'height:611px' not in s or 'height:148.5mm' not in s: raise SystemExit('Half-page dimensions missing')
          print('HTML structure checks passed')
          PY
      - name: Validate all inline editor scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          if len(blocks)<2: raise SystemExit(f'Expected at least 2 inline script blocks, got {len(blocks)}')
          for i,b in enumerate(blocks,1): Path(f'/tmp/editor-{i}.js').write_text(b,encoding='utf-8')
          print(f'Extracted {len(blocks)} inline script blocks')
          PY
          for f in /tmp/editor-*.js; do node --check "$f"; done
          echo 'All inline JavaScript syntax checks passed'
      - name: Validate site password JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -f site-password.js
          node --check site-password.js
          grep -q "medical_emr_site_access_v1" site-password.js
          echo 'site-password.js checks passed'
      - name: Validate handwriting signature JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -f signature.js
          node --check signature.js
          grep -q 'handSignBtn' signature.js
          grep -q 'Ma Shan Zheng' signature.js
          echo 'signature.js checks passed'
      - name: Validate smart-identify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -f smart-identify.js
          node --check smart-identify.js
          echo 'smart-identify.js syntax check passed'
      - name: Check half-page regression rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'subhealth-halfpage-mode' index.html
          grep -q 'height:611px' index.html
          grep -q 'height:148.5mm' index.html
          echo 'Half-page regression markers present'
