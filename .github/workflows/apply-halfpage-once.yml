name: Apply half-page templates
on:
  push:
    paths:
      - 'HALFPAGE_APPLY_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply half-page subhealth layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css_marker='/* half-page subhealth layout final */'
          css='''\n/* half-page subhealth layout final */\n.subhealth-halfpage-mode .paper{width:864px!important;height:627px!important;}\n.subhealth-halfpage-mode .stagein{width:864px;height:627px;}\n.subhealth-halfpage-mode .node[data-id="doctype"]{display:none!important;}\n.subhealth-halfpage-mode .node[data-id="sign"]{top:535px!important;}\n.subhealth-halfpage-mode .node[data-id="reportDate"]{top:535px!important;}\n.subhealth-halfpage-mode .node[data-id="note"],.subhealth-halfpage-mode .node[data-id="page"]{display:none!important;}\n@media print{.subhealth-halfpage-mode .paper{width:216mm!important;height:156.75mm!important;box-shadow:none}.subhealth-halfpage-mode .stage{padding:0;overflow:visible}}\n'''
          if css_marker not in s:
              i=s.find('</style>')
              if i<0: raise SystemExit('missing style closing tag')
              s=s[:i]+css+s[i:]
          js_marker='/* half-page subhealth behavior final */'
          js='''<script>\n/* half-page subhealth behavior final */\n(()=>{\n const sub=()=>document.body.dataset.template?.startsWith('subhealth:');\n const p=()=>document.getElementById('paper');\n const st=()=>document.getElementById('stagein');\n const z=()=>{const m=(document.getElementById('z100')?.textContent||'100%').match(/[0-9.]+/);return m?parseFloat(m[0])/100:1};\n const clean=()=>{if(!sub())return;document.querySelectorAll('#paper .node').forEach(n=>{n.textContent=(n.textContent||'').replace(/_{3,}/g,'').trimEnd();});document.querySelectorAll('#paper .rule[data-id="subline"]').forEach(e=>e.remove());};\n const apply=()=>{const x=p(),y=st();if(!x||!y)return;const is=sub();document.body.classList.toggle('subhealth-halfpage-mode',!!is);if(is){x.style.width='864px';x.style.height='627px';y.style.width=(864*z())+'px';y.style.height=(627*z())+'px';clean();}else{x.style.width='864px';x.style.height='1254px';y.style.width=(864*z())+'px';y.style.height=(1254*z())+'px';}};\n const bind=()=>['fit','zm','zp','z100'].forEach(id=>{const b=document.getElementById(id);if(b&&!b.dataset.hpfBound){b.dataset.hpfBound='1';b.addEventListener('click',()=>setTimeout(apply,50));}});\n const addPrint=()=>{if(!sub()||document.getElementById('halfpage-print-page'))return;const s=document.createElement('style');s.id='halfpage-print-page';s.textContent='@media print{@page{size:216mm 156.75mm;margin:0}}';document.head.appendChild(s)};\n const remPrint=()=>document.getElementById('halfpage-print-page')?.remove();\n const mo=new MutationObserver(()=>{bind();apply();});mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','data-template']});\n window.addEventListener('beforeprint',addPrint);window.addEventListener('afterprint',remPrint);window.addEventListener('resize',apply);\n bind();setTimeout(apply,100);setTimeout(apply,500);setTimeout(apply,1200);\n})();\n</script>'''
          if js_marker not in s:
              i=s.rfind('</body>')
              if i<0: raise SystemExit('missing body closing tag')
              s=s[:i]+js+s[i:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'half-page subhealth layout final' index.html
          grep -q 'half-page subhealth behavior final' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/editor-inline.js').write_text(blocks[0],encoding='utf-8')
          Path('/tmp/halfpage.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/editor-inline.js
          node --check /tmp/halfpage.js
          echo 'half-page patch validation passed'
      - name: Commit index only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No index changes needed'; exit 0; fi
          git commit -m 'fix: use half-page dimensions for subhealth templates'
          git push
