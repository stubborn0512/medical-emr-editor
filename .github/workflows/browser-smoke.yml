name: Browser smoke test
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-fund --no-audit playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Smoke test deployed site
        env:
          BASE_URL: https://stubborn0512.github.io/medical-emr-editor/
        run: |
          mkdir -p artifacts
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:900},deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
          let ready=false,last='';
          for(let i=0;i<18;i++){
            try{
              await page.goto(process.env.BASE_URL,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1200);
              if(await page.locator('#paper').count()===1 && await page.locator('#ct').count()===1){ready=true;break;}
            }catch(e){last=e.message}
            await page.waitForTimeout(4000);
          }
          if(!ready) throw new Error('Deployed site never became ready: '+last);
          await page.waitForTimeout(1200);
          await page.evaluate(()=>sessionStorage.setItem('medical_emr_site_access_v1','1'));
          await page.reload({waitUntil:'domcontentloaded'});
          await page.waitForTimeout(1000);
          if(await page.locator('#sitePasswordGate').count()!==0) throw new Error('Stored unlock did not bypass gate');
          const title=await page.title();
          const paper=await page.locator('#paper').count();
          const smart=await page.locator('#smart').count();
          const sigButton=await page.locator('#handSignBtn').count();
          console.log({title,paper,smart,sigButton,errors});
          await page.screenshot({path:'artifacts/initial.png'});
          if(errors.length) throw new Error(errors.join(' | '));
          if(sigButton!==1) throw new Error('Handwriting signature button missing');
          await page.locator('.sh[data-sh="skin"]').click();
          await page.waitForTimeout(700);
          const active=await page.locator('.sh[data-sh="skin"]').evaluate(el=>el.classList.contains('active'));
          const paperHeight=await page.locator('#paper').evaluate(el=>el.offsetHeight);
          const paperWidth=await page.locator('#paper').evaluate(el=>el.offsetWidth);
          const overflow=await page.evaluate(()=>{const p=document.getElementById('paper');return [...p.querySelectorAll('.node')].filter(n=>{const s=getComputedStyle(n);if(s.display==='none'||s.visibility==='hidden')return false;const l=n.offsetLeft,t=n.offsetTop,r=l+n.offsetWidth,b=t+n.offsetHeight;return l<0||t<0||r>p.offsetWidth||b>p.offsetHeight}).length});
          console.log({skinActive:active,paperHeight,paperWidth,overflow});
          await page.screenshot({path:'artifacts/skin-before-signature.png'});
          if(!active) throw new Error('Skin template did not activate');
          if(paperWidth!==864 || paperHeight!==611) throw new Error(`Unexpected untransformed half-page size: ${paperWidth}x${paperHeight}`);
          if(overflow>0) throw new Error(`Half-page element overflow count: ${overflow}`);
          await page.locator('#handSignBtn').click();
          await page.waitForTimeout(300);
          if(await page.locator('#sigModal').evaluate(el=>getComputedStyle(el).display)!=='flex') throw new Error('Signature modal did not open');
          const font=await page.locator('#sigFont').inputValue();
          if(!font) throw new Error('Signature font selector is empty');
          await page.locator('#sigText').fill('示例医生');
          await page.locator('#sigApply').click();
          await page.waitForTimeout(700);
          const sign=page.locator('#paper .node[data-id="sign"]');
          if(await sign.count()!==1) throw new Error('Signature node missing');
          const signStyle=await sign.evaluate(el=>({fontFamily:el.style.fontFamily,computedFont:getComputedStyle(el).fontFamily,fontSize:el.style.fontSize,transform:el.style.transform,marker:el.dataset.handwritingSignature,text:el.textContent}));
          const fontLoaded=await page.evaluate(()=>document.fonts.check('28px "Ma Shan Zheng"','示例医生'));
          console.log({signStyle,fontLoaded});
          await page.screenshot({path:'artifacts/skin-with-signature.png'});
          if(signStyle.marker!=='1') throw new Error('Handwriting signature marker missing');
          if(!signStyle.fontFamily.includes('Ma Shan Zheng') && !signStyle.fontFamily.includes('Long Cang') && !signStyle.fontFamily.includes('Zhi Mang Xing')) throw new Error('Unexpected handwriting font family');
          if(!fontLoaded) throw new Error('Chinese handwriting font Ma Shan Zheng did not load in Chromium');
          if(!signStyle.text.includes('签名')) throw new Error('Signature label missing');
          await browser.close();
          EOF
          node smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
