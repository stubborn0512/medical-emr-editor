name: Browser smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-fund --no-audit playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Smoke test deployed site
        env:
          BASE_URL: https://stubborn0512.github.io/medical-emr-editor/
        run: |
          mkdir -p artifacts
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base=process.env.BASE_URL;
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:900},deviceScaleFactor:1});
          const errors=[]; const nav=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
          page.on('framenavigated',f=>{if(f===page.mainFrame()) nav.push(f.url())});
          let ready=false,last='';
          for(let i=0;i<18;i++){
            try{
              await page.goto(base,{waitUntil:'domcontentloaded',timeout:15000});
              await page.waitForTimeout(1000);
              const has=await page.locator('#paper').count()===1 && await page.locator('#ct').count()===1;
              if(has){ready=true;break;}
            }catch(e){last=e.message}
            await page.waitForTimeout(5000);
          }
          if(!ready) throw new Error('Deployed site never became ready: '+last);
          await page.waitForTimeout(2500);
          if(await page.locator('#sitePasswordGate').count()!==1) throw new Error('Site password gate missing');
          await page.locator('#sitePasswordInput').fill('incorrect');
          await page.locator('#sitePasswordSubmit').click();
          await page.waitForTimeout(150);
          if(await page.locator('#sitePasswordGate').count()!==1) throw new Error('Wrong password unexpectedly unlocked site');
          await page.evaluate(()=>sessionStorage.setItem('medical_emr_site_access_v1','1'));
          await page.reload({waitUntil:'domcontentloaded'});
          await page.waitForTimeout(500);
          if(await page.locator('#sitePasswordGate').count()!==0) throw new Error('Stored unlock did not bypass gate');
          const title=await page.title();
          const paper=await page.locator('#paper').count();
          const smart=await page.locator('#smart').count();
          const navEntries=await page.evaluate(()=>performance.getEntriesByType('navigation').length);
          await page.screenshot({path:'artifacts/initial.png'});
          console.log({title,paper,smart,navigations:nav.length,navEntries,errors});
          if(errors.length) throw new Error(errors.join(' | '));
          await page.locator('#smart').click();
          await page.waitForTimeout(250);
          if(await page.locator('#smartModal').evaluate(el=>getComputedStyle(el).display)!=='flex') throw new Error('Smart modal did not open');
          await page.locator('#smartClose').click();
          await page.waitForTimeout(150);
          if(await page.locator('#smartModal').evaluate(el=>getComputedStyle(el).display)==='flex') throw new Error('Smart modal did not close');
          await page.locator('.sh[data-sh="skin"]').click();
          await page.waitForTimeout(350);
          const active=await page.locator('.sh[data-sh="skin"]').evaluate(el=>el.classList.contains('active'));
          const paperHeight=await page.locator('#paper').evaluate(el=>el.offsetHeight);
          const paperWidth=await page.locator('#paper').evaluate(el=>el.offsetWidth);
          const overflow=await page.evaluate(()=>{const p=document.getElementById('paper').getBoundingClientRect();return [...document.querySelectorAll('#paper .node')].filter(n=>{const r=n.getBoundingClientRect();return r.right>p.right+1||r.bottom>p.bottom+1||r.left<p.left-1||r.top<p.top-1}).length});
          await page.screenshot({path:'artifacts/skin.png'});
          console.log({skinActive:active,paperHeight,paperWidth,overflow});
          if(!active) throw new Error('Skin template did not activate');
          if(paperWidth!==864 || paperHeight!==611) throw new Error(`Unexpected untransformed half-page size: ${paperWidth}x${paperHeight}`);
          if(overflow>0) throw new Error(`Half-page element overflow count: ${overflow}`);
          if(await page.locator('#siteLockButton').count()!==1) throw new Error('Site lock button missing after unlock');
          await page.locator('#siteLockButton').click();
          await page.waitForTimeout(300);
          if(await page.locator('#sitePasswordGate').count()!==1) throw new Error('Site lock did not restore password gate');
          await browser.close();
          EOF
          node smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
