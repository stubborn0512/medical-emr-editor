name: Browser smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-fund --no-audit playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages deployment
        env:
          EXPECTED_FONT_CSS: https://cdnjs.cloudflare.com/ajax/libs/fontsource-ma-shan-zheng/5.3.1/chinese-simplified.css
        run: |
          python - <<'PY'
          import time, urllib.request
          target='https://stubborn0512.github.io/medical-emr-editor/signature.js'
          expected='https://cdnjs.cloudflare.com/ajax/libs/fontsource-ma-shan-zheng/5.3.1/chinese-simplified.css'
          last=''
          for i in range(36):
              try:
                  req=urllib.request.Request(target,headers={'Cache-Control':'no-cache'})
                  body=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
                  if expected in body:
                      print(f'Pages is serving the expected signature.js after {i+1} checks')
                      break
                  last='signature.js is reachable but still old'
              except Exception as e:
                  last=str(e)
              time.sleep(5)
          else:
              raise SystemExit('GitHub Pages did not serve the new signature.js in time: '+last)
          PY
      - name: Smoke test deployed site
        env:
          BASE_URL: https://stubborn0512.github.io/medical-emr-editor/
        run: |
          mkdir -p artifacts
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:900},deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
          await page.goto(process.env.BASE_URL,{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(1800);
          await page.evaluate(()=>sessionStorage.setItem('medical_emr_site_access_v1','1'));
          await page.reload({waitUntil:'domcontentloaded'});
          await page.waitForTimeout(1200);
          if(await page.locator('#sitePasswordGate').count()!==0) throw new Error('Stored unlock did not bypass gate');
          if(await page.locator('#paper').count()!==1) throw new Error('Paper missing');
          if(await page.locator('#smart').count()!==1) throw new Error('Smart identify button missing');
          if(await page.locator('#handSignBtn').count()!==1) throw new Error('Handwriting signature button missing');
          await page.locator('.sh[data-sh="skin"]').click();
          await page.waitForTimeout(1000);
          const active=await page.locator('.sh[data-sh="skin"]').evaluate(el=>el.classList.contains('active'));
          const paperHeight=await page.locator('#paper').evaluate(el=>el.offsetHeight);
          const paperWidth=await page.locator('#paper').evaluate(el=>el.offsetWidth);
          const overflow=await page.evaluate(()=>{const p=document.getElementById('paper');return [...p.querySelectorAll('.node')].filter(n=>{const s=getComputedStyle(n);if(s.display==='none'||s.visibility==='hidden')return false;const l=n.offsetLeft,t=n.offsetTop,r=l+n.offsetWidth,b=t+n.offsetHeight;return l<0||t<0||r>p.offsetWidth||b>p.offsetHeight}).length});
          if(!active) throw new Error('Skin template did not activate');
          if(paperWidth!==864||paperHeight!==611) throw new Error(`Unexpected half-page size: ${paperWidth}x${paperHeight}`);
          if(overflow>0) throw new Error(`Half-page element overflow count: ${overflow}`);
          const defaultSign=page.locator('#paper .node[data-id="sign"]');
          if(await defaultSign.count()!==1) throw new Error('Signature node was not created by skin template');
          const defaultSignStyle=await defaultSign.evaluate(el=>({inline:el.style.fontFamily,computed:getComputedStyle(el).fontFamily,size:el.style.fontSize,marker:el.dataset.handwritingSignature,text:el.textContent}));
          const defaultFontLoaded=await page.evaluate(()=>document.fonts.check('28px "Ma Shan Zheng"','示例医生'));
          if(defaultSignStyle.marker!=='1') throw new Error('Default signature was not re-styled after template rebuild');
          if(!defaultSignStyle.inline.includes('Ma Shan Zheng')) throw new Error('Default signature font family is not Ma Shan Zheng after template rebuild');
          if(!defaultFontLoaded) throw new Error('Ma Shan Zheng Chinese font did not load before applying default signature');
          await page.locator('#handSignBtn').click();
          await page.waitForTimeout(400);
          if(await page.locator('#sigModal').evaluate(el=>getComputedStyle(el).display)!=='flex') throw new Error('Signature modal did not open');
          const selectedFont=await page.locator('#sigFont').inputValue();
          if(selectedFont!=='Ma Shan Zheng') throw new Error('Default handwriting font selector is not Ma Shan Zheng');
          await page.locator('#sigText').fill('示例医生');
          await page.locator('#sigApply').click();
          await page.waitForTimeout(900);
          const sign=page.locator('#paper .node[data-id="sign"]');
          if(await sign.count()!==1) throw new Error('Signature node missing');
          const signStyle=await sign.evaluate(el=>({inline:el.style.fontFamily,computed:getComputedStyle(el).fontFamily,size:el.style.fontSize,marker:el.dataset.handwritingSignature,text:el.textContent}));
          const fontLoaded=await page.evaluate(()=>document.fonts.check('28px "Ma Shan Zheng"','示例医生'));
          await page.screenshot({path:'artifacts/handwriting-signature.png'});
          await page.emulateMedia({media:'print'});
          await page.pdf({path:'artifacts/skin-halfpage.pdf',printBackground:true,preferCSSPageSize:true});
          console.log({title:await page.title(),skinActive:active,paperWidth,paperHeight,overflow,defaultSignStyle,defaultFontLoaded,selectedFont,signStyle,fontLoaded,errors});
          if(errors.length) throw new Error(errors.join(' | '));
          if(signStyle.marker!=='1') throw new Error('Handwriting signature marker missing');
          if(!signStyle.inline.includes('Ma Shan Zheng')) throw new Error('Signature inline font family is not Ma Shan Zheng');
          if(!fontLoaded) throw new Error('Ma Shan Zheng Chinese font did not load in Chromium');
          if(!signStyle.text.includes('签名')) throw new Error('Signature label missing');
          await browser.close();
          EOF
          node smoke.mjs
      - name: Verify half-page PDF dimensions
        shell: bash
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          p=PdfReader('artifacts/skin-halfpage.pdf')
          if len(p.pages)!=1:
              raise SystemExit(f'Expected exactly 1 PDF page, got {len(p.pages)}')
          box=p.pages[0].mediabox
          w=float(box.width); h=float(box.height)
          target_w=210/25.4*72
          target_h=148.5/25.4*72
          print(f'PDF MediaBox: {w:.3f} x {h:.3f} pt; target {target_w:.3f} x {target_h:.3f} pt')
          if abs(w-target_w)>1.0 or abs(h-target_h)>1.0:
              raise SystemExit(f'Half-page PDF size mismatch: {w:.3f} x {h:.3f} pt')
          print('Half-page PDF dimensions verified')
          PY
      - name: Upload browser screenshots and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: artifacts/*
          if-no-files-found: ignore
