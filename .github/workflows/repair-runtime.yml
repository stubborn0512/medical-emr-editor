name: Repair runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-runtime.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize broken inline JavaScript strings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', re.S | re.I)
          matches = list(pat.finditer(s))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one inline script block, found {len(matches)}')

          script = matches[0].group(1)
          out = []
          state = None
          escaped = False
          changed = 0

          i = 0
          while i < len(script):
              ch = script[i]
              if state is None:
                  if ch in ('\'', '"', '`'):
                      state = ch
                      escaped = False
                  out.append(ch)
                  i += 1
                  continue

              if escaped:
                  out.append(ch)
                  escaped = False
                  i += 1
                  continue

              if ch == '\\':
                  # Preserve the escape, but normalize a backslash followed by a literal
                  # newline so the JavaScript remains syntactically valid.
                  if i + 1 < len(script) and script[i + 1] in ('\n', '\r') and state in ('\'', '"'):
                      out.extend(['\\', 'n'])
                      changed += 1
                      i += 2
                      if i < len(script) and script[i-1] == '\r' and script[i] == '\n':
                          i += 1
                      escaped = False
                      continue
                  out.append(ch)
                  escaped = True
                  i += 1
                  continue

              if ch == state:
                  out.append(ch)
                  state = None
                  i += 1
                  continue

              if state in ('\'', '"') and ch in ('\n', '\r'):
                  out.extend(['\\', 'n'])
                  changed += 1
                  if ch == '\r' and i + 1 < len(script) and script[i + 1] == '\n':
                      i += 1
                  i += 1
                  continue

              out.append(ch)
              i += 1

          fixed = ''.join(out)
          p.write_text(s[:matches[0].start(1)] + fixed + s[matches[0].end(1):], encoding='utf-8')
          print(f'Normalized {changed} literal newline(s) inside quoted JavaScript strings')
          PY

      - name: Validate repaired editor script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          if len(blocks) != 1:
              raise SystemExit(f'Expected exactly 1 inline script block, got {len(blocks)}')
          Path('/tmp/editor.js').write_text(blocks[0], encoding='utf-8')
          print('Inline script extracted')
          PY
          node --check /tmp/editor.js
          test -f smart-identify.js
          node --check smart-identify.js
          echo 'JavaScript syntax checks passed'

      - name: Commit repaired app only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No app changes needed'
            exit 0
          fi
          git commit -m 'fix: restore editor initialization'
          git push
