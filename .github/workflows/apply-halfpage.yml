name: Apply half-page subhealth layout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-halfpage.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch subhealth half-page layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* half-page subhealth layout */'
          css = '''\n/* half-page subhealth layout */\n.subhealth-halfpage-mode .paper{width:816px;height:594px;}\n.subhealth-halfpage-mode .stagein{height:594px;}\n@media print{.subhealth-halfpage-mode .paper{width:216mm;height:156.75mm;}.subhealth-halfpage-mode .stage{padding:0;overflow:visible;}.subhealth-halfpage-mode .paper{box-shadow:none;}}\n'''
          if marker not in s:
              idx = s.find('</style>')
              if idx < 0: raise SystemExit('Missing </style>')
              s = s[:idx] + css + s[idx:]
          js_marker = '/* half-page subhealth behavior */'
          js = r'''<script>\n/* half-page subhealth behavior */\n(()=>{\n  const paper=()=>document.getElementById('paper');\n  const stagein=()=>document.getElementById('stagein');\n  const list=()=>Array.from(document.querySelectorAll('.sh'));\n  const isSub=()=>list().some(b=>b.classList.contains('active'));\n  const clean=()=>{ if(!isSub()) return; document.querySelectorAll('#paper .node').forEach(n=>{ if(/_{3,}/.test(n.textContent||'')) n.textContent=(n.textContent||'').replace(/_{3,}/g,''); }); };\n  const apply=()=>{ const p=paper(), st=stagein(); if(!p||!st)return; document.body.classList.toggle('subhealth-halfpage-mode',isSub()); if(isSub()){ p.style.width='816px'; p.style.height='594px'; st.style.height='594px'; clean(); } else { p.style.width='864px'; p.style.height='1254px'; st.style.height='1254px'; } };\n  const bind=()=>list().forEach(b=>{ if(!b.dataset.halfpageBound){ b.dataset.halfpageBound='1'; b.addEventListener('click',()=>setTimeout(apply,30)); } });\n  const mo=new MutationObserver(()=>{bind();apply();});\n  mo.observe(document.body,{subtree:true,attributes:true,attributeFilter:['class'],childList:true});\n  bind(); apply();\n})();\n</script>'''
          if js_marker not in s:
              idx = s.rfind('</body>')
              if idx < 0: raise SystemExit('Missing </body>')
              s = s[:idx] + js + s[idx:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate patched app
        shell: bash
        run: |
          set -euo pipefail
          node --check <(python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          print(blocks[-1] if blocks else '')
          PY
          )
          grep -q 'half-page subhealth layout' index.html
          grep -q 'subhealth-halfpage-mode' index.html
          echo 'half-page patch validation passed'
      - name: Commit patch only once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Already applied'; exit 0; fi
          git commit -m 'fix: make subhealth templates half-page'
          git push
