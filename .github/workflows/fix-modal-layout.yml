name: One-time modal layout fix

on:
  push:
    paths:
      - '.github/workflows/fix-modal-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch modal and toast styles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* editor modal layout fix */'
          if marker not in s:
              css = r'''/* editor modal layout fix */
          .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(20,27,36,.45);z-index:10000}
          .modal.show{display:flex!important}
          .modal .card{width:min(720px,94vw);max-height:88vh;overflow:auto;background:#fff;border:1px solid #d8dde4;border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.28);padding:14px}
          .modal textarea{display:block;width:100%;min-height:260px;resize:vertical;border:1px solid #cfd5dc;border-radius:5px;padding:8px;font:inherit}
          .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;background:#20252b;color:#fff;padding:9px 13px;border-radius:7px;z-index:10001;box-shadow:0 8px 30px rgba(0,0,0,.2)}
          .toast.show{display:block}
          @media print{.modal,.toast{display:none!important}}
          '''
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
              print('Modal CSS patched')
          else:
              print('Modal CSS already patched')
          PY

      - name: Verify modal CSS in generated page
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'editor modal layout fix' index.html
          grep -q '\.modal\.show' index.html
          grep -q '\.toast\.show' index.html
          echo 'Modal layout checks passed'

      - name: Commit app fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/workflows/fix-modal-layout.yml
          git commit -m 'fix: center editor modals and toast'
          git push
