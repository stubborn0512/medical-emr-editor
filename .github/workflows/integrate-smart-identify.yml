name: Integrate smart identify
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[smart-identify]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add smart identify script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="smart-identify.js"></script>'
          if tag in s:
              raise SystemExit('smart identify already integrated')
          marker='</body>'
          if marker not in s:
              raise SystemExit('body end not found')
          p.write_text(s.replace(marker,tag+marker,1),encoding='utf-8')
      - name: Validate editor and smart parser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['index.html','smart-identify.js']:
              if not Path(name).exists(): raise SystemExit(f'missing {name}')
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/editor.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/editor.js
          node --check smart-identify.js
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: integrate smart text field identification [smart-identify]"
          git push