name: Install site password gate
on:
  push:
    paths:
      - '.github/workflows/install-site-password.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install password gate and browser checks
        shell: bash
        run: |
          set -euo pipefail
          cat > site-password.js <<'EOF'
          (()=>{'use strict';
          const PASS_HASH='d0405845e965f40e32657ff3ca011703b25902c153fa5a042656a32c98f701b0';
          const KEY='medical_emr_site_access_v1';
          const hash=async s=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
          const unlock=()=>{document.getElementById('sitePasswordGate')?.remove();document.body.style.overflow='';document.querySelector('#authGate')?.remove()};
          const lock=()=>{sessionStorage.removeItem(KEY);location.reload()};
          const lockButton=()=>{const bar=document.getElementById('authUserBar');if(!bar||document.getElementById('siteLockButton'))return;const b=document.createElement('button');b.className='tb';b.id='siteLockButton';b.type='button';b.textContent='锁定';b.title='锁定网站并重新输入访问密码';b.onclick=lock;bar.appendChild(b)};
          const open=()=>{if(sessionStorage.getItem(KEY)==='1'){document.querySelector('#authGate')?.remove();document.querySelector('.wm')?.remove();document.body.style.overflow='';lockButton();return}document.body.style.overflow='hidden';document.querySelector('.wm')?.remove();const s=document.createElement('style');s.textContent='#sitePasswordGate{position:fixed;inset:0;z-index:50000;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef1f5,#dde3ea);padding:20px}#sitePasswordCard{width:min(400px,92vw);background:#fff;border:1px solid #d8dde4;border-radius:14px;box-shadow:0 18px 70px rgba(0,0,0,.18);padding:26px}#sitePasswordCard h2{margin:0 0 6px;font-size:20px}#sitePasswordCard p{margin:0 0 18px;font-size:12px;color:#707783}#sitePasswordInput{display:block;width:100%;padding:11px;border:1px solid #cfd5dc;border-radius:7px;outline:none;box-sizing:border-box}#sitePasswordSubmit{margin-top:12px;width:100%;padding:10px;border:1px solid #356bc3;border-radius:7px;background:#356bc3;color:#fff;cursor:pointer}#sitePasswordMsg{min-height:18px;margin-top:9px;font-size:11px;color:#a33}';document.head.appendChild(s);const g=document.createElement('div');g.id='sitePasswordGate';g.innerHTML='<div id="sitePasswordCard"><h2>请输入访问密码</h2><p>输入正确密码后进入医疗文书模板编辑器。</p><input id="sitePasswordInput" type="password" autocomplete="current-password" placeholder="访问密码"><button id="sitePasswordSubmit" type="button">进入网站</button><div id="sitePasswordMsg"></div></div>';document.body.appendChild(g);const input=document.getElementById('sitePasswordInput');const submit=async()=>{const ok=(await hash(input.value))===PASS_HASH;if(ok){sessionStorage.setItem(KEY,'1');unlock();lockButton()}else{document.getElementById('sitePasswordMsg').textContent='密码错误，请重新输入。';input.select()}};document.getElementById('sitePasswordSubmit').onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});setTimeout(()=>input.focus(),0)};
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',open);else open();
          })();
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="site-password.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          w=Path('.github/workflows/browser-smoke.yml')
          ws=w.read_text(encoding='utf-8')
          marker="          const title=await page.title();"
          insert="          if(await page.locator('#sitePasswordGate').count()!==1) throw new Error('Site password gate missing');\n          await page.locator('#sitePasswordInput').fill('incorrect');\n          await page.locator('#sitePasswordSubmit').click();\n          await page.waitForTimeout(150);\n          if(await page.locator('#sitePasswordGate').count()!==1) throw new Error('Wrong password unexpectedly unlocked site');\n          await page.evaluate(()=>sessionStorage.setItem('medical_emr_site_access_v1','1'));\n          await page.reload({waitUntil:'domcontentloaded'});\n          await page.waitForTimeout(400);\n          if(await page.locator('#sitePasswordGate').count()!==0) throw new Error('Site password gate did not honor unlocked session');\n          const title=await page.title();"
          if marker in ws and 'sitePasswordGate' not in ws:
              ws=ws.replace(marker,insert,1)
          w.write_text(ws,encoding='utf-8')
          PY
      - name: Commit and remove installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site-password.js .github/workflows/browser-smoke.yml
          git rm .github/workflows/install-site-password.yml
          git commit -m 'feat: add site password gate'
          git push
